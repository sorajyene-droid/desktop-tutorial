<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#327f32"/>
      <stop offset="0.5" stop-color="#2a6b2a"/>
      <stop offset="1" stop-color="#1c4f1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Road stripes -->
  <rect x="220" y="0"  width="72" height="512" fill="#5d4037"/>
  <rect x="220" y="0"  width="8"  height="512" fill="#8d6e63"/>
  <rect x="284" y="0"  width="8"  height="512" fill="#8d6e63"/>
  <g fill="#ffd54a">
    <rect x="252" y="40"  width="8" height="40"/>
    <rect x="252" y="120" width="8" height="40"/>
    <rect x="252" y="200" width="8" height="40"/>
    <rect x="252" y="280" width="8" height="40"/>
    <rect x="252" y="360" width="8" height="40"/>
    <rect x="252" y="440" width="8" height="40"/>
  </g>
  <!-- Tank treads -->
  <rect x="120" y="170" width="22" height="180" fill="#0a0a0a"/>
  <rect x="370" y="170" width="22" height="180" fill="#0a0a0a"/>
  <g fill="#3a3a3a">
    <rect x="120" y="180" width="22" height="14"/>
    <rect x="120" y="208" width="22" height="14"/>
    <rect x="120" y="236" width="22" height="14"/>
    <rect x="120" y="264" width="22" height="14"/>
    <rect x="120" y="292" width="22" height="14"/>
    <rect x="120" y="320" width="22" height="14"/>
    <rect x="370" y="180" width="22" height="14"/>
    <rect x="370" y="208" width="22" height="14"/>
    <rect x="370" y="236" width="22" height="14"/>
    <rect x="370" y="264" width="22" height="14"/>
    <rect x="370" y="292" width="22" height="14"/>
    <rect x="370" y="320" width="22" height="14"/>
  </g>
  <!-- Tank hull -->
  <rect x="142" y="190" width="228" height="160" fill="#7d6537"/>
  <rect x="142" y="190" width="228" height="14" fill="#a78c5c"/>
  <rect x="142" y="336" width="228" height="14" fill="#4a3920"/>
  <!-- Turret -->
  <rect x="186" y="208" width="140" height="120" fill="#5b4520"/>
  <rect x="186" y="208" width="140" height="12" fill="#8a6d3b"/>
  <!-- Barrel -->
  <rect x="246" y="120" width="20" height="100" fill="#1a1a1a"/>
  <rect x="240" y="116" width="32" height="14" fill="#333"/>
  <!-- Star -->
  <polygon points="256,236 264,256 286,256 268,270 274,290 256,278 238,290 244,270 226,256 248,256" fill="#ffd54a"/>
  <!-- Title -->
  <text x="256" y="450" font-family="monospace" font-size="64" font-weight="bold" text-anchor="middle" fill="url(#title)" stroke="#000" stroke-width="3">FC</text>
</svg>
