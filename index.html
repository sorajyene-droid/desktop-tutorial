<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO アプリ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>TODO リスト</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="やることを入力..."
        autocomplete="off"
        required
      />
      <button type="submit">追加</button>
    </form>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">すべて</button>
      <button type="button" class="filter-btn" data-filter="active">未完了</button>
      <button type="button" class="filter-btn" data-filter="completed">完了</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="count">0 件</span>
      <button type="button" id="clear-completed">完了したものを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
