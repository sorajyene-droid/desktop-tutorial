function drawTank(e, friendly=false, stunned=false, big=false){
  const x=e.x, y=e.y;
  // Long ground shadow
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(x, y+13, 16, 3.5, 0, 0, Math.PI*2); ctx.fill();

  const body = friendly ? "#43a047" : (big ? "#4e342e" : "#7d6537");
  const bodyDark = darken(body, 0.55);
  const bodyHi = "rgba(255,255,255,0.18)";
  const turret = friendly ? "#2e7d32" : (big ? "#3e2723" : "#5b4520");

  // Treads (left/right) — chunkier with road-wheel detail
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-13, y-12, 5, 24);
  ctx.fillRect(x+8, y-12, 5, 24);
  // tread top/bottom highlight
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-13, y-12, 5, 1);
  ctx.fillRect(x+8, y-12, 5, 1);
  // rolling tread segments
  ctx.fillStyle = "#444";
  for (let i=0;i<7;i++){
    const yy = y - 12 + i*4 + ((state.t/3)|0)%4;
    ctx.fillRect(x-12, yy, 3, 2);
    ctx.fillRect(x+9, yy, 3, 2);
  }
  // Road wheels (circles inside treads)
  ctx.fillStyle = "#2a2a2a";
  for (let i=0;i<4;i++){
    const yy = y - 9 + i*7;
    ctx.beginPath(); ctx.arc(x-10, yy, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+10, yy, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = "#555";
  for (let i=0;i<4;i++){
    const yy = y - 9 + i*7;
    ctx.beginPath(); ctx.arc(x-10, yy, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+10, yy, 1, 0, Math.PI*2); ctx.fill();
  }

  // Lower hull
  ctx.fillStyle = body;
  ctx.fillRect(x-9, y-9, 18, 18);
  // Top highlight
  ctx.fillStyle = bodyHi;
  ctx.fillRect(x-9, y-9, 18, 2);
  // Bottom shading
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.fillRect(x-9, y+6, 18, 3);
  // Rivets along edges
  ctx.fillStyle = bodyDark;
  for (let i=0;i<3;i++){
    ctx.fillRect(x-8 + i*8, y-7, 1, 1);
    ctx.fillRect(x-8 + i*8, y+5, 1, 1);
  }
  // Front fender
  ctx.fillStyle = bodyDark;
  ctx.fillRect(x-10, y+5, 20, 2);
  // National marking (star)
  ctx.fillStyle = friendly ? "#fff" : "#ffd54a";
  ctx.fillRect(x-1, y+1, 2, 2);
  ctx.fillRect(x-2, y+2, 4, 0.8);

  // Turret base
  ctx.fillStyle = turret;
  ctx.fillRect(x-7, y-7, 14, 12);
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(x-7, y-7, 14, 2);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x-7, y+3, 14, 2);
  // Hatch on turret
  ctx.fillStyle = darken(turret, 0.55);
  ctx.fillRect(x-2, y-4, 4, 4);
  ctx.fillStyle = "#222";
  ctx.fillRect(x-2, y-4, 4, 1);

  // Main barrel — thicker for big tank
  if (big){
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(x-2, y-18, 4, 11);
    ctx.fillStyle = "#333";
    ctx.fillRect(x-3, y-18, 6, 3);  // muzzle brake
    ctx.fillRect(x-2, y-7, 4, 2);   // breech
  } else {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(x-1, y-16, 2, 10);
    ctx.fillStyle = "#333";
    ctx.fillRect(x-2, y-16, 4, 2);
    ctx.fillRect(x-2, y-7, 4, 2);
  }
  // Coaxial MG
  ctx.fillStyle = "#222";
  ctx.fillRect(x+3, y-7, 1, 4);
  // Antenna
  ctx.fillStyle = "#222";
  ctx.fillRect(x+5, y-12, 1, 6);
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(x+5, y-13, 1, 1);

  if (stunned){
    ctx.fillStyle = "#ffeb3b";
    const s = Math.sin(state.t*0.4)*2;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("!?", x, y-14 + s);
  }
}

function drawAPC(e, friendly=false, stunned=false){
  const x=e.x, y=e.y;
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(x, y+14, 14, 3, 0, 0, Math.PI*2); ctx.fill();

  const body = friendly ? "#388e3c" : "#3e4f54";
  const dark = darken(body, 0.55);

  // 6 wheels (3 each side) with rotating spoke detail
  ctx.fillStyle = "#0a0a0a";
  for (let i=-1;i<=1;i++){
    ctx.fillRect(x-12, y-9 + i*8, 5, 6);
    ctx.fillRect(x+7, y-9 + i*8, 5, 6);
  }
  // wheel hubs
  ctx.fillStyle = "#444";
  for (let i=-1;i<=1;i++){
    ctx.fillRect(x-11, y-7 + i*8, 3, 2);
    ctx.fillRect(x+8, y-7 + i*8, 3, 2);
  }

  // Sloped armor body
  ctx.fillStyle = body;
  ctx.fillRect(x-9, y-12, 18, 24);
  // upper sloped panel — fake bevel via highlights
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x-9, y-12, 18, 2);
  ctx.fillRect(x-9, y-12, 1, 8);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x-9, y+9, 18, 3);
  ctx.fillRect(x+8, y-12, 1, 24);

  // Side viewport
  ctx.fillStyle = dark;
  ctx.fillRect(x-8, y-2, 3, 2);
  ctx.fillRect(x+5, y-2, 3, 2);

  // Front grill
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-7, y+10, 14, 2);
  for (let i=0;i<5;i++){
    ctx.fillStyle = "#444";
    ctx.fillRect(x-6 + i*3, y+10, 1, 2);
  }

  // Roof hatch with MG turret
  ctx.fillStyle = dark;
  ctx.fillRect(x-4, y-6, 8, 6);
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(x-4, y-6, 8, 1);
  ctx.fillStyle = darken(body, 0.7);
  ctx.fillRect(x-3, y-3, 6, 3);
  // MG barrel
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-1, y-12, 2, 6);
  ctx.fillStyle = "#444";
  ctx.fillRect(x-2, y-12, 4, 1);
  // Antenna
  ctx.fillStyle = "#222";
  ctx.fillRect(x+5, y-10, 1, 7);
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(x+5, y-11, 1, 1);
  // headlight
  ctx.fillStyle = "#ffeb3b";
  ctx.fillRect(x-7, y+8, 2, 2);
  ctx.fillRect(x+5, y+8, 2, 2);

  if (stunned){
    ctx.fillStyle = "#ffeb3b";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("!?", x, y-14 + Math.sin(state.t*0.4)*2);
  }
}

function drawMech(e, friendly=false, stunned=false){
  const x=e.x, y=e.y;
  const wp = e.walkPhase || 0;
  const lstep = Math.sin(wp)*3, rstep = Math.sin(wp+Math.PI)*3;

  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(x, y+16, 14, 3, 0, 0, Math.PI*2); ctx.fill();

  const body = friendly ? "#388e3c" : "#4d6571";
  const dark = darken(body, 0.55);
  const accent = friendly ? "#1b5e20" : "#263238";

  // Hip pivots
  ctx.fillStyle = accent;
  ctx.fillRect(x-7, y+1, 4, 3);
  ctx.fillRect(x+3, y+1, 4, 3);

  // Upper legs (thigh)
  ctx.fillStyle = body;
  ctx.fillRect(x-7, y+3, 4, 6 + (lstep>0?2:0));
  ctx.fillRect(x+3, y+3, 4, 6 + (rstep>0?2:0));
  // knee joint
  ctx.fillStyle = accent;
  ctx.fillRect(x-7, y+8 + (lstep>0?2:0), 4, 2);
  ctx.fillRect(x+3, y+8 + (rstep>0?2:0), 4, 2);
  // Lower legs (shin)
  ctx.fillStyle = dark;
  ctx.fillRect(x-6, y+10 + (lstep>0?2:0), 2, 5);
  ctx.fillRect(x+4, y+10 + (rstep>0?2:0), 2, 5);
  // Feet (wide bases)
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-9, y+14 + (lstep>0?2:0), 8, 3);
  ctx.fillRect(x+1, y+14 + (rstep>0?2:0), 8, 3);
  ctx.fillStyle = "#333";
  ctx.fillRect(x-9, y+14 + (lstep>0?2:0), 8, 1);
  ctx.fillRect(x+1, y+14 + (rstep>0?2:0), 8, 1);

  // Torso (rounded shoulders)
  ctx.fillStyle = body;
  ctx.fillRect(x-9, y-11, 18, 14);
  // Top highlight
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(x-9, y-11, 18, 3);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x-9, y+0, 18, 3);
  // Chest plate detail
  ctx.fillStyle = darken(body, 0.4);
  ctx.fillRect(x-5, y-7, 10, 6);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x-5, y-7, 10, 1);
  // Cockpit window
  ctx.fillStyle = friendly ? "#a5d6a7" : "#80deea";
  ctx.fillRect(x-3, y-6, 6, 4);
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillRect(x-3, y-6, 6, 1);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x-3, y-3, 6, 1);

  // Shoulder pauldrons
  ctx.fillStyle = darken(body, 0.5);
  ctx.fillRect(x-11, y-10, 3, 6);
  ctx.fillRect(x+8, y-10, 3, 6);
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(x-11, y-10, 3, 1);
  ctx.fillRect(x+8, y-10, 3, 1);

  // Arm guns (gatling-style)
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-13, y-5, 4, 8);
  ctx.fillRect(x+9, y-5, 4, 8);
  // multi-barrels
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-13, y-13, 1, 8);
  ctx.fillRect(x-11, y-13, 1, 8);
  ctx.fillRect(x+10, y-13, 1, 8);
  ctx.fillRect(x+12, y-13, 1, 8);
  ctx.fillStyle = "#666";
  ctx.fillRect(x-13, y-13, 4, 1);
  ctx.fillRect(x+9, y-13, 4, 1);

  // Antenna
  ctx.fillStyle = "#222";
  ctx.fillRect(x+0, y-13, 1, 4);
  ctx.fillStyle = friendly ? "#9ef" : "#ff5252";
  ctx.fillRect(x+0, y-14, 1, 1);

  if (stunned){
    ctx.fillStyle = "#ffeb3b";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("!?", x, y-16 + Math.sin(state.t*0.4)*2);
  }
}

function drawHeli(e, friendly=false, attack=false, stunned=false){
  const x=e.x, y=e.y;
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(x, y+13, 18, 3.5, 0, 0, Math.PI*2); ctx.fill();

  const body = friendly ? "#2e7d32" : (attack ? "#3e2723" : "#37474f");
  const dark = darken(body, 0.6);

  // Tail boom
  ctx.fillStyle = body;
  ctx.fillRect(x+8, y-2, 14, 4);
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(x+8, y-2, 14, 1);
  // Tail fin
  ctx.fillStyle = body;
  ctx.fillRect(x+19, y-7, 4, 9);
  ctx.fillStyle = darken(body, 0.5);
  ctx.fillRect(x+22, y-7, 1, 9);
  // Tail rotor
  ctx.fillStyle = "#1a1a1a";
  const tailAng = (e.bladePhase||0)*2;
  ctx.save();
  ctx.translate(x+22, y-2);
  ctx.rotate(tailAng);
  ctx.fillRect(-4, -0.5, 8, 1);
  ctx.restore();

  // Main body (egg-shaped via stacked rectangles)
  ctx.fillStyle = body;
  ctx.fillRect(x-13, y-7, 22, 13);
  ctx.fillRect(x-11, y-9, 18, 2);
  ctx.fillRect(x-11, y+6, 18, 1);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x-13, y-7, 22, 2);
  ctx.fillRect(x-11, y-9, 18, 1);
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.fillRect(x-13, y+4, 22, 3);

  // Cockpit window (rounded)
  ctx.fillStyle = "#80deea";
  ctx.fillRect(x-12, y-5, 8, 6);
  ctx.fillRect(x-13, y-3, 1, 3);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fillRect(x-12, y-5, 8, 2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(x-12, y+0, 8, 1);
  // Window frame
  ctx.fillStyle = dark;
  ctx.fillRect(x-8, y-5, 1, 6);

  // Engine/intake
  ctx.fillStyle = dark;
  ctx.fillRect(x-2, y-9, 8, 3);
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x+1, y-9, 4, 1);

  // Side door / number
  ctx.fillStyle = "#fff";
  ctx.font = "bold 6px monospace";
  ctx.textAlign = "center";
  ctx.fillText(attack ? "AH" : "UH", x-2, y+1);

  // Stub wings with weapons (attack)
  if (attack){
    ctx.fillStyle = dark;
    ctx.fillRect(x-10, y+5, 20, 2);
    // Rocket pods
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x-10, y+7, 6, 3);
    ctx.fillRect(x+4, y+7, 6, 3);
    ctx.fillStyle = "#1a1a1a";
    for (let i=0;i<3;i++){
      ctx.fillRect(x-9 + i*2, y+7, 1, 1);
      ctx.fillRect(x+5 + i*2, y+7, 1, 1);
    }
    // Missiles
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(x-2, y+7, 4, 2);
    ctx.fillStyle = "#fff";
    ctx.fillRect(x+2, y+7, 1, 2);
  }

  // Skid landing gear
  ctx.fillStyle = "#222";
  ctx.fillRect(x-12, y+8, 22, 1);
  ctx.fillRect(x-10, y+7, 1, 2);
  ctx.fillRect(x+9, y+7, 1, 2);

  // Main rotor mast
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-2, y-11, 4, 3);
  // Rotor (spinning)
  const ang = e.bladePhase || state.t*0.4;
  ctx.save();
  ctx.translate(x, y-9);
  ctx.rotate(ang);
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(-18, -1, 36, 2);
  ctx.fillStyle = "#444";
  ctx.fillRect(-18, -1, 36, 1);
  ctx.restore();
  // rotor blur disc
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.beginPath(); ctx.arc(x, y-9, 18, 0, Math.PI*2); ctx.fill();

  if (stunned){
    ctx.fillStyle = "#ffeb3b";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("!?", x, y-14 + Math.sin(state.t*0.4)*2);
  }
}

function drawPara(e){
  const x=e.x, y=e.y;
  if (!e.landed){
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(x, y+12, 6, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fafafa";
    ctx.beginPath();
    ctx.arc(x, y-10, 9, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = "#bdbdbd";
    ctx.fillRect(x-9, y-11, 3, 2);
    ctx.fillRect(x+6, y-11, 3, 2);
    ctx.strokeStyle="#cfcfcf";
    ctx.beginPath();
    ctx.moveTo(x-8,y-10); ctx.lineTo(x-2,y-2);
    ctx.moveTo(x+8,y-10); ctx.lineTo(x+2,y-2);
    ctx.stroke();
  }
  drawSoldier(x, y, "#c0392b", e.walkPhase||0, 1);
}

function bossPalette(b, enraged){
  const stage = b.archetype || state.stage;
  if (stage === 1) return { hull:"#5d4037", deck:"#3e2723", hi:"#8d6e63", core:enraged?"#ff1744":"#ffd54a" };
  if (stage === 2) return { hull:"#a1622a", deck:"#7a3f12", hi:"#d49a5a", core:enraged?"#ff1744":"#ff9800" };
  if (stage === 3) return { hull:"#37474f", deck:"#1c2025", hi:"#607d8b", core:enraged?"#ff1744":"#00e5ff" };
  if (stage === 4) return { hull:"#90a4ae", deck:"#455a64", hi:"#cfd8dc", core:enraged?"#ff1744":"#80deea" };
  if (stage === 5) return { hull:"#3e2723", deck:"#1a0a08", hi:"#bf360c", core:enraged?"#ff1744":"#ff6f00" };
  return { hull:"#311b92", deck:"#1a0a4a", hi:"#7c4dff", core:enraged?"#ff1744":"#e040fb" };
}

function drawBossFortress(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  // Treads
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x - w/2 - 6, y - h/2, 8, h);
  ctx.fillRect(x + w/2 - 2, y - h/2, 8, h);
  ctx.fillStyle = "#3a3a3a";
  for (let i=0;i<Math.floor(h/6);i++){
    const yy = y - h/2 + i*6 + ((state.t/3)|0)%6;
    ctx.fillRect(x - w/2 - 5, yy, 6, 3);
    ctx.fillRect(x + w/2 - 1, yy, 6, 3);
  }
  ctx.fillStyle = pal.hull; ctx.fillRect(x - w/2, y - h/2, w, h);
  ctx.fillStyle = "rgba(255,255,255,0.13)"; ctx.fillRect(x - w/2, y - h/2, w, 5);
  ctx.fillStyle = "rgba(0,0,0,0.3)";        ctx.fillRect(x - w/2, y + h/2 - 6, w, 6);
  ctx.fillStyle = pal.hi;
  for (let px=-Math.floor(w/2)+8; px<w/2-6; px+=18)
    for (let py=-Math.floor(h/2)+8; py<h/2-6; py+=22) ctx.fillRect(x+px, y+py, 2, 2);
  ctx.fillStyle = pal.deck; ctx.fillRect(x - w*0.42, y - h*0.2, w*0.84, h*0.5);
  ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(x - w*0.42, y - h*0.2, w*0.84, 3);
}

function drawBossCrab(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  // Body — round carapace
  ctx.fillStyle = pal.hull;
  ctx.beginPath(); ctx.ellipse(x, y, w*0.4, h*0.55, 0, 0, Math.PI*2); ctx.fill();
  // Carapace shell pattern
  ctx.fillStyle = pal.deck;
  ctx.beginPath(); ctx.ellipse(x, y-h*0.05, w*0.32, h*0.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.beginPath(); ctx.ellipse(x, y-h*0.18, w*0.3, h*0.18, 0, 0, Math.PI*2); ctx.fill();
  // Eye stalks (2)
  for (const sx of [-1, 1]){
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(x + sx*w*0.18 - 1, y - h*0.45, 2, 12);
    ctx.fillStyle = pal.core;
    ctx.beginPath(); ctx.arc(x + sx*w*0.18, y - h*0.5, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x + sx*w*0.18 - 1, y - h*0.52, 1.5, 0, Math.PI*2); ctx.fill();
  }
  // Mandibles (mouth)
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-8, y+h*0.2, 16, 6);
  ctx.fillStyle = "#444";
  for (let i=0;i<5;i++) ctx.fillRect(x-7 + i*4, y+h*0.2, 2, 6);
  // Spikes around shell
  ctx.fillStyle = pal.deck;
  for (let a=0; a<6; a++){
    const ang = Math.PI + (a/5)*Math.PI;
    const sx = x + Math.cos(ang)*w*0.4;
    const sy = y + Math.sin(ang)*h*0.55;
    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(ang)*8, sy + Math.sin(ang)*8);
    ctx.lineTo(sx + Math.cos(ang+0.4)*4, sy + Math.sin(ang+0.4)*4); ctx.closePath(); ctx.fill();
  }
}

function drawBossCarrier(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  // Bottom shadow / hull belly
  ctx.fillStyle = pal.deck;
  ctx.beginPath();
  ctx.moveTo(x - w/2, y - h*0.2);
  ctx.lineTo(x - w/2 - 10, y);
  ctx.lineTo(x - w/2, y + h/2);
  ctx.lineTo(x + w/2, y + h/2);
  ctx.lineTo(x + w/2 + 10, y);
  ctx.lineTo(x + w/2, y - h*0.2);
  ctx.closePath(); ctx.fill();
  // Flight deck
  ctx.fillStyle = pal.hull;
  ctx.fillRect(x - w/2, y - h/2, w, h*0.4);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x - w/2, y - h/2, w, 3);
  // Runway markings
  ctx.fillStyle = "#ffeb3b";
  for (let i=-2;i<=2;i++){
    ctx.fillRect(x + i*w*0.15 - 6, y - h*0.32, 12, 2);
  }
  // Bridge tower
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x + w*0.1, y - h*0.5, 24, 16);
  ctx.fillStyle = pal.hi;
  ctx.fillRect(x + w*0.1, y - h*0.5, 24, 3);
  // Window strip
  ctx.fillStyle = "#80deea";
  ctx.fillRect(x + w*0.1 + 2, y - h*0.45, 20, 3);
  // Side weapons / engines
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x - w/2 + 4, y, 12, 8);
  ctx.fillRect(x + w/2 - 16, y, 12, 8);
  // Underside bay opening (where the BAY part will be)
  ctx.fillStyle = "#000";
  ctx.fillRect(x - w*0.18, y + h*0.08, w*0.36, h*0.12);
}

function drawBossWalker(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  const wp = b.moveT*0.04;
  const lstep = Math.sin(wp)*4, rstep = Math.sin(wp+Math.PI)*4;
  // Legs
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x - w*0.30, y + h*0.05, 12, h*0.4 + (lstep>0?6:0));
  ctx.fillRect(x + w*0.18, y + h*0.05, 12, h*0.4 + (rstep>0?6:0));
  // Knee joint
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.30, y + h*0.30 + (lstep>0?3:0), 12, 6);
  ctx.fillRect(x + w*0.18, y + h*0.30 + (rstep>0?3:0), 12, 6);
  // Feet
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x - w*0.34, y + h*0.45 + (lstep>0?6:0), 20, 6);
  ctx.fillRect(x + w*0.14, y + h*0.45 + (rstep>0?6:0), 20, 6);
  // Hip
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.36, y + h*0.0, w*0.72, 12);
  // Torso
  ctx.fillStyle = pal.hull;
  ctx.fillRect(x - w*0.42, y - h*0.4, w*0.84, h*0.5);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x - w*0.42, y - h*0.4, w*0.84, 4);
  // Shoulder stripes
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.42, y - h*0.15, w*0.84, 6);
  // Cockpit visor
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x - w*0.18, y - h*0.32, w*0.36, h*0.1);
  ctx.fillStyle = pal.core;
  for (let i=0;i<5;i++) ctx.fillRect(x - w*0.16 + i*w*0.08, y - h*0.30, w*0.04, 3);
  // Antenna
  ctx.fillStyle = "#222";
  ctx.fillRect(x - 1, y - h*0.5, 2, 10);
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(x - 1, y - h*0.5 - 2, 2, 2);
}

function drawBossTrain(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  // Three connected cars
  for (let i=-1;i<=1;i++){
    const cx = x + i*w*0.32;
    ctx.fillStyle = pal.hull;
    ctx.fillRect(cx - w*0.15, y - h*0.25, w*0.3, h*0.5);
    ctx.fillStyle = "rgba(255,255,255,0.13)";
    ctx.fillRect(cx - w*0.15, y - h*0.25, w*0.3, 3);
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.fillRect(cx - w*0.15, y + h*0.20, w*0.3, 4);
    // window strip
    ctx.fillStyle = pal.core;
    for (let j=0;j<5;j++) ctx.fillRect(cx - w*0.13 + j*w*0.06, y - h*0.05, w*0.04, 4);
  }
  // Couplings
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x - w*0.20, y - 3, w*0.06, 6);
  ctx.fillRect(x + w*0.14, y - 3, w*0.06, 6);
  // Rails / wheels along bottom
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x - w/2, y + h*0.30, w, 4);
  ctx.fillStyle = "#444";
  for (let i=0;i<10;i++){
    ctx.fillRect(x - w/2 + i*(w/10) + ((state.t/3)|0)%6, y + h*0.30, 4, 4);
  }
  // Smokestack on front (left)
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.46, y - h*0.42, 8, 14);
  // Smoke
  if (state.t % 6 === 0){
    state.smoke.push({x: x - w*0.42, y: y - h*0.45, vx:rand(-0.4,0.4), vy:-0.6, life:60, r:5});
  }
  // Headlight
  ctx.fillStyle = "#ffeb3b";
  ctx.fillRect(x - w/2 - 6, y - h*0.2, 4, 6);
}

function drawBossOverlord(b, pal, enraged){
  const x=b.x, y=b.y, w=b.w, h=b.h;
  // Cape / wings
  ctx.fillStyle = "rgba(40,0,80,0.6)";
  ctx.beginPath();
  ctx.moveTo(x - w*0.55, y - h*0.2);
  ctx.lineTo(x - w*0.7, y + h*0.5);
  ctx.lineTo(x + w*0.7, y + h*0.5);
  ctx.lineTo(x + w*0.55, y - h*0.2);
  ctx.closePath(); ctx.fill();
  // Torso
  ctx.fillStyle = pal.hull;
  ctx.fillRect(x - w*0.30, y - h*0.4, w*0.6, h*0.6);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x - w*0.30, y - h*0.4, w*0.6, 4);
  // Chest plate gem
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.18, y - h*0.18, w*0.36, h*0.32);
  ctx.fillStyle = pal.core;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(x-2, y-2, 3, 0, Math.PI*2); ctx.fill();
  // Helm
  ctx.fillStyle = pal.deck;
  ctx.fillRect(x - w*0.16, y - h*0.5, w*0.32, h*0.14);
  ctx.fillStyle = pal.hi;
  ctx.fillRect(x - w*0.16, y - h*0.5, w*0.32, 3);
  // Glowing eye visor
  ctx.fillStyle = pal.core;
  ctx.fillRect(x - w*0.13, y - h*0.42, w*0.26, 3);
  // Horns
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.moveTo(x - w*0.16, y - h*0.5); ctx.lineTo(x - w*0.28, y - h*0.62); ctx.lineTo(x - w*0.10, y - h*0.5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w*0.16, y - h*0.5); ctx.lineTo(x + w*0.28, y - h*0.62); ctx.lineTo(x + w*0.10, y - h*0.5); ctx.closePath(); ctx.fill();
  // Belt
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x - w*0.32, y + h*0.15, w*0.64, 4);
  ctx.fillStyle = pal.core;
  ctx.fillRect(x - 2, y + h*0.16, 4, 2);
}

function drawBoss(){
  const b = state.boss; if (!b) return;
  const x=b.x, y=b.y;
  const w=b.w, h=b.h;
  const enraged = b.hp < b.maxHp * 0.5;
  const palette = bossPalette(b, enraged);

  // Big shadow under all boss types
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath(); ctx.ellipse(x, y+h/2+8, w*0.55, 8, 0, 0, Math.PI*2); ctx.fill();

  // Dispatch by shape
  switch (b.shape){
    case "crab":     drawBossCrab(b, palette, enraged); break;
    case "carrier":  drawBossCarrier(b, palette, enraged); break;
    case "walker":   drawBossWalker(b, palette, enraged); break;
    case "train":    drawBossTrain(b, palette, enraged); break;
    case "overlord": drawBossOverlord(b, palette, enraged); break;
    default:         drawBossFortress(b, palette, enraged);
  }

  // Sub-turrets (parts) — common across shapes
  const pal = palette;
  for (const part of b.parts){
    const wp = bossPartWorldPos(b, part);
    const px=wp.x, py=wp.y;
    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(px, py + part.h*0.5, part.w*0.5, 3, 0, 0, Math.PI*2); ctx.fill();
    if (part.hp <= 0){
      // Wrecked hulk
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(px - part.w/2, py - part.h/2, part.w, part.h);
      ctx.fillStyle = "#444";
      for (let i=0;i<5;i++){
        ctx.fillRect(px - part.w/3 + i*4, py - part.h/4, 2, 2);
      }
      // smoke pulse
      if ((state.t + part.name.length*7) % 18 === 0){
        state.smoke.push({x:px+rand(-5,5), y:py-rand(0,4), vx:rand(-0.3,0.3), vy:rand(-1.2,-0.5), life:60, r:6});
      }
    } else {
      // Turret base
      ctx.fillStyle = palette.deck;
      ctx.fillRect(px - part.w/2, py - part.h/2, part.w, part.h);
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(px - part.w/2, py - part.h/2, part.w, 3);
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(px - part.w/2, py + part.h/2 - 3, part.w, 3);
      // turret dome
      ctx.fillStyle = palette.hull;
      ctx.fillRect(px - part.w*0.35, py - part.h*0.3, part.w*0.7, part.h*0.6);
      // barrel(s)
      ctx.fillStyle = "#111";
      if (part.name === "TOP_GUN"){
        ctx.fillRect(px - 2, py - part.h*0.3 - 10, 4, 10);
      } else {
        ctx.fillRect(px - 4, py - part.h*0.3 - 8, 3, 8);
        ctx.fillRect(px + 1, py - part.h*0.3 - 8, 3, 8);
      }
      // turret hp pips
      const pipW = part.w * 0.7;
      ctx.fillStyle = "#000";
      ctx.fillRect(px - pipW/2 - 1, py + part.h/2 + 2, pipW + 2, 4);
      ctx.fillStyle = "#ff5252";
      ctx.fillRect(px - pipW/2, py + part.h/2 + 3, pipW * (part.hp/part.max), 2);
    }
  }

  // CORE EYE — only shapes that have a "central core" overlay
  if (b.shape === "fortress" || !b.shape){
    const coreR = Math.max(8, w*0.07);
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(x, y, coreR+3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = palette.core;
    ctx.beginPath(); ctx.arc(x, y, coreR, 0, Math.PI*2); ctx.fill();
    const pulse = (Math.sin(state.t*0.15)+1)*0.5;
    ctx.fillStyle = `rgba(255,255,255,${0.25 + pulse*0.5})`;
    ctx.beginPath(); ctx.arc(x - coreR*0.3, y - coreR*0.3, coreR*0.45, 0, Math.PI*2); ctx.fill();
    if (enraged){
      ctx.fillStyle = "#000";
      ctx.fillRect(x - coreR, y - coreR - 4, coreR*2, 3);
    }
    ctx.fillStyle = "#111";
    ctx.fillRect(x-4, y + h*0.3, 8, h*0.25);
    ctx.fillStyle = "#333";
    ctx.fillRect(x-5, y + h*0.3, 10, 4);
  }

  // Boss name banner during intro
  if (b.introT < 150){
    const a = b.introT < 120 ? 1 : (150 - b.introT)/30;
    ctx.fillStyle = `rgba(0,0,0,${0.6*a})`;
    ctx.fillRect(0, H - 70, W, 30);
    ctx.fillStyle = `rgba(255,82,82,${a})`;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("WARNING — APPROACHING TARGET", W/2, H - 56);
    ctx.fillStyle = `rgba(255,213,74,${a})`;
    ctx.font = "bold 16px monospace";
    ctx.fillText(b.name, W/2, H - 40);
  }

  // HP bar
  const bw = 240;
  ctx.fillStyle = "#000";
  ctx.fillRect(W/2 - bw/2 - 2, 22, bw+4, 10);
  ctx.fillStyle = "#b71c1c";
  ctx.fillRect(W/2 - bw/2, 24, bw * (b.hp / b.maxHp), 6);
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillRect(W/2 - bw/2, 24, bw * (b.hp / b.maxHp), 2);
  ctx.fillStyle = "#fff";
  ctx.font = "9px monospace";
  ctx.textAlign = "center";
  ctx.fillText(b.name, W/2, 21);
}

function drawBullet(b, color="#ffd54a"){
  if (b.kind === "rocket"){
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(b.x-3, b.y-3, 6, 6);
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(b.x-1, b.y-1, 2, 2);
    return;
  }
  ctx.fillStyle = color;
  ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, 1);
}

function drawGrenade(g){
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(g.x, g.y+5, 4, 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.spin);
  ctx.fillStyle = "#3e2723";
  ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#666";
  ctx.fillRect(-1, -5, 2, 2);
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(-1, -3, 2, 1);
  ctx.restore();
}

function drawItem(it){
  if (it.kind === "blast"){
    // Yellow energy capsule with pulsing ring
    const bob = Math.sin(state.t*0.15)*1;
    const pulse = (Math.sin(state.t*0.2)+1)*0.5;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath(); ctx.ellipse(it.x, it.y+6, 7, 1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = `rgba(255,213,74,${0.3 + pulse*0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(it.x, it.y+bob, 8 + pulse*2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "#ffd54a";
    ctx.beginPath(); ctx.arc(it.x, it.y+bob, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
    ctx.fillText("X", it.x, it.y+bob+3);
  } else if (it.kind === "medkit"){
    // White box with red cross
    const bob = Math.sin(state.t*0.15)*1;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath(); ctx.ellipse(it.x, it.y+6, 7, 1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(it.x-6, it.y-5+bob, 12, 10);
    ctx.fillStyle = "#bbb";
    ctx.fillRect(it.x-6, it.y+3+bob, 12, 2);
    ctx.fillStyle = "#e53935";
    ctx.fillRect(it.x-1, it.y-3+bob, 2, 6);
    ctx.fillRect(it.x-3, it.y-1+bob, 6, 2);
  } else if (it.kind === "pow"){
    const bob = Math.sin(it.bob||0) * 1.5;
    drawSoldier(it.x, it.y + bob, "#3a7d3a", it.bob||0, -1);
    ctx.fillStyle = "#222";
    ctx.fillRect(it.x+4, it.y-18+bob, 1, 12);
    ctx.fillStyle = "#fff";
    ctx.fillRect(it.x+5, it.y-18+bob, 7, 5);
    if ((state.t/8|0)%2 === 0){
      ctx.fillStyle = "#ffeb3b";
      ctx.font = "bold 10px monospace";
      ctx.textAlign = "center";
      ctx.fillText("HELP!", it.x, it.y - 22 + bob);
    }
  } else {
    ctx.fillStyle = "#e91e63";
    ctx.fillRect(it.x-4, it.y-4, 8, 8);
    ctx.fillStyle = "#fff";
    ctx.font = "9px monospace"; ctx.textAlign="center";
    ctx.fillText("1UP", it.x, it.y+3);
  }
}

function drawAlly(a){
  const blink = (a.invuln > 0 && (state.t % 6) < 3);
  if (!blink){
    drawSoldier(a.x, a.y, "#1976d2", a.walkPhase||0, -1);
  }
  // Ally HP bar above head
  const max = a.maxHp || 5;
  const w = 14;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(a.x - w/2 - 1, a.y - 16, w + 2, 3);
  ctx.fillStyle = a.hp > max*0.5 ? "#4caf50" : (a.hp > max*0.25 ? "#ffeb3b" : "#ff5252");
  ctx.fillRect(a.x - w/2, a.y - 15, w * (a.hp / max), 1);
}

function drawFX(){
  for (const f of state.fx){
    if (f.kind === "spark"){
      ctx.fillStyle = f.c;
      ctx.fillRect(f.x - f.r/2, f.y - f.r/2, f.r, f.r);
    } else if (f.kind === "ring"){
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = Math.max(0, f.life / 22);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.kind === "muzzle"){
      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(f.x, f.y, 2, 0, Math.PI*2); ctx.fill();
    } else if (f.kind === "text"){
      f.x += 0; f.y += f.vy;
      const a = Math.min(1, f.life / 30);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#000";
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x+1, f.y+1);
      ctx.fillStyle = f.c;
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }
}
function drawSmoke(){
  for (const s of state.smoke){
    const a = Math.min(0.5, s.life/80);
    ctx.fillStyle = `rgba(180,180,180,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
}

function drawHeart(cx, cy, fill, hi){
  ctx.fillStyle = fill;
  // 9x8 pixel-art heart
  ctx.fillRect(cx-3, cy-2, 2, 2);
  ctx.fillRect(cx+1, cy-2, 2, 2);
  ctx.fillRect(cx-4, cy, 8, 2);
  ctx.fillRect(cx-3, cy+2, 6, 1);
  ctx.fillRect(cx-2, cy+3, 4, 1);
  ctx.fillRect(cx-1, cy+4, 2, 1);
  // highlight
  ctx.fillStyle = hi;
  ctx.fillRect(cx-3, cy-1, 1, 1);
  ctx.fillRect(cx-4, cy+1, 1, 1);
}

function drawHUD(){
  // Top status bar (taller now to fit HP)
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, 32);
  // Row 1: score / stage / lives
  ctx.fillStyle = "#ffd54a";
  ctx.font = "10px monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + String(state.score).padStart(6,"0"), 6, 12);
  ctx.textAlign = "center";
  ctx.fillStyle = "#9ef";
  ctx.fillText("STAGE " + state.stage, W/2, 12);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd54a";
  ctx.fillText("LIFE " + Math.max(0, state.player.lives + 1), W-6, 12);

  // Row 2: HP hearts on left, grenades & allies in middle, vehicle on right
  const p = state.player;
  // Hearts
  for (let i = 0; i < p.maxHp; i++){
    const hx = 8 + i*12;
    const hy = 22;
    if (i < p.hp){
      drawHeart(hx, hy, "#e53935", "#ff8a80");
    } else {
      drawHeart(hx, hy, "#3a3a3a", "#555");
    }
  }
  // Grenades & allies
  ctx.font = "10px monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#ffd54a";
  ctx.fillText("BLAST:" + p.blastStock, 78, 27);
  if (state.allies.length > 0){
    ctx.fillStyle = "#64b5f6";
    ctx.fillText("味方:" + state.allies.length, 118, 27);
  }
  // Vehicle bar (when piloted)
  if (p.mode !== "foot"){
    const vehMax = {tank:14, apc:8, mech:11, heli:9}[p.mode] || 9;
    const w = 88;
    ctx.fillStyle = "#000";
    ctx.fillRect(W - w - 8, 22, w, 8);
    ctx.fillStyle = "#9ef";
    ctx.fillRect(W - w - 8, 22, w * Math.max(0, p.vehHp / vehMax), 8);
    ctx.fillStyle = "#fff";
    ctx.font = "9px monospace";
    ctx.textAlign = "right";
    ctx.fillText(p.mode.toUpperCase()+" "+p.vehHp, W-12, 28);
  }
  if (audio.isMuted()){
    ctx.fillStyle = "#ff5252";
    ctx.font = "8px monospace";
    ctx.textAlign = "right";
    ctx.fillText("MUTE", W-8, 38);
  }

  if (state.stageBanner > 0 && state.screen === "play"){
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, H/2 - 30, W, 60);
    ctx.fillStyle = "#ffd54a";
    ctx.font = "bold 22px monospace";
    ctx.textAlign = "center";
    ctx.fillText("STAGE " + state.stage, W/2, H/2 + 6);
  }
}

function drawHero(x, y, walkPhase=0){
  // Elite operator: tactical helmet with NVG, vest with mags, scarf, knife
  const step = Math.sin(walkPhase) * 2;
  const armSwing = Math.sin(walkPhase) * 1.5;

  // Long shadow
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(x, y+12, 9, 3, 0, 0, Math.PI*2); ctx.fill();

  // Backpack
  ctx.fillStyle = "#1c2620";
  ctx.fillRect(x-3, y-3, 6, 7);
  ctx.fillStyle = "#3a4a3e";
  ctx.fillRect(x-3, y-3, 6, 1);
  // sleeping roll on top
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(x-3, y-4, 6, 1);

  // Legs (cargo pants — dark olive)
  ctx.fillStyle = "#3b4a32";
  const lLen = 5 + (step>0?1:0);
  const rLen = 5 + (step<0?1:0);
  ctx.fillRect(x-3, y+3, 2, lLen);
  ctx.fillRect(x+1, y+3, 2, rLen);
  // Knee pads (rectangles)
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-3, y+5, 2, 1);
  ctx.fillRect(x+1, y+5, 2, 1);
  // Combat boots (chunkier)
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-4, y+3+lLen, 4, 3);
  ctx.fillRect(x+0, y+3+rLen, 4, 3);
  // boot lace highlight
  ctx.fillStyle = "#444";
  ctx.fillRect(x-3, y+3+lLen, 2, 1);
  ctx.fillRect(x+1, y+3+rLen, 2, 1);

  // Tactical vest body — dark camo
  ctx.fillStyle = "#2f3a26";
  ctx.fillRect(x-4, y-3, 8, 7);
  // Camo blotches (lighter and darker)
  ctx.fillStyle = "#4a5a3a";
  ctx.fillRect(x-3, y-2, 2, 2);
  ctx.fillRect(x+1, y, 2, 2);
  ctx.fillStyle = "#1f2a18";
  ctx.fillRect(x-2, y+1, 2, 1);
  ctx.fillRect(x+2, y-2, 1, 2);
  // Vest plating outline
  ctx.fillStyle = "#1a2218";
  ctx.fillRect(x-4, y-3, 8, 1);
  ctx.fillRect(x-4, y+3, 8, 1);
  ctx.fillRect(x-4, y-3, 1, 7);
  ctx.fillRect(x+3, y-3, 1, 7);
  // Magazine pouches on chest
  ctx.fillStyle = "#1c1c1c";
  ctx.fillRect(x-3, y-1, 2, 3);
  ctx.fillRect(x+1, y-1, 2, 3);
  ctx.fillStyle = "#444";
  ctx.fillRect(x-3, y-1, 2, 1);
  ctx.fillRect(x+1, y-1, 2, 1);
  // Belt
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-4, y+2, 8, 1);
  ctx.fillStyle = "#9e7e3a";
  ctx.fillRect(x-1, y+2, 2, 1);
  // Holstered pistol on hip
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x+3, y+3, 2, 3);
  // Combat knife
  ctx.fillStyle = "#bbb";
  ctx.fillRect(x-5, y+3, 1, 3);
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(x-5, y+6, 1, 1);

  // Scarf / shemagh around neck
  ctx.fillStyle = "#b71c1c";
  ctx.fillRect(x-4, y-5, 8, 2);
  ctx.fillStyle = "#7d0000";
  ctx.fillRect(x-4, y-4, 8, 1);
  // Scarf tail flutter
  if (Math.sin(walkPhase) > 0){
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(x-6, y-4, 2, 1);
  } else {
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(x+4, y-4, 2, 1);
  }

  // Shoulder armor pads
  ctx.fillStyle = "#2a3320";
  ctx.fillRect(x-5, y-3, 1, 3);
  ctx.fillRect(x+4, y-3, 1, 3);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x-5, y-3, 1, 1);
  ctx.fillRect(x+4, y-3, 1, 1);

  // Head (tan skin)
  ctx.fillStyle = "#e9b88a";
  ctx.fillRect(x-3, y-9, 6, 5);
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fillRect(x+2, y-9, 1, 5);

  // Tactical helmet with rim
  ctx.fillStyle = "#2a3320";
  ctx.fillRect(x-4, y-12, 8, 4);
  ctx.fillStyle = "#1a2218";
  ctx.fillRect(x-4, y-9, 8, 1);
  // Helmet highlight
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(x-3, y-12, 6, 1);
  // Helmet camo strip
  ctx.fillStyle = "#4a5a3a";
  ctx.fillRect(x-2, y-11, 1, 1);
  ctx.fillRect(x+1, y-10, 2, 1);
  // NVG mount + tubes (the cool factor)
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-1, y-13, 2, 2);
  ctx.fillRect(x-3, y-12, 2, 3);
  ctx.fillRect(x+1, y-12, 2, 3);
  // NVG lens glow
  ctx.fillStyle = "#80ff80";
  ctx.fillRect(x-3, y-11, 1, 1);
  ctx.fillRect(x+2, y-11, 1, 1);

  // Chin strap
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-3, y-5, 6, 1);

  // Modern carbine (stocked, scoped)
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x+1, y-14, 2, 9);     // barrel
  ctx.fillStyle = "#444";
  ctx.fillRect(x+1, y-14, 2, 1);     // muzzle
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(x-1, y-7, 5, 2);      // stock/foregrip
  // Scope
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x+1, y-10, 2, 2);
  ctx.fillStyle = "#80deea";
  ctx.fillRect(x+1, y-10, 1, 1);
  // Trigger guard hint
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x+0, y-6, 1, 2);
}

function drawPlayer(){
  const p = state.player;
  const blink = (p.invuln > 0 && (state.t % 6) < 3);
  if (blink) return;
  switch(p.mode){
    case "tank": drawTank({x:p.x, y:p.y}, true, false, p.vehHp > 9); break;
    case "heli": drawHeli({x:p.x, y:p.y, bladePhase:state.t*0.6}, true, false, false); break;
    case "mech": drawMech({x:p.x, y:p.y, walkPhase:p.walkPhase||0}, true, false); break;
    case "apc":  drawAPC({x:p.x, y:p.y}, true, false); break;
    default:     drawHero(p.x, p.y, p.walkPhase||0);
  }
  if (p.muzzle > 0){
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath(); ctx.arc(p.x+2, p.y-14, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(p.x+2, p.y-14, 2, 0, Math.PI*2); ctx.fill();
  }
}

function render(){
  if (state.screen === "title"){
    drawTitle();
    return;
  }

  // shake
  const shx = state.shake ? rand(-state.shake, state.shake) : 0;
  const shy = state.shake ? rand(-state.shake, state.shake) : 0;
  ctx.save();
  ctx.translate(shx, shy);

  drawBackground();
  drawSmoke();

  for (const it of state.items) drawItem(it);
  // Support Blast effect (expanding ring)
  if (state.player.blastFx > 0){
    const t = 50 - state.player.blastFx;
    const r = t * 8;
    const a = state.player.blastFx / 50;
    ctx.strokeStyle = `rgba(255,213,74,${a})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(state.player.x, state.player.y, r, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a*0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(state.player.x, state.player.y, r*0.7, 0, Math.PI*2); ctx.stroke();
  }

  for (const e of state.enemies){
    switch(e.type){
      case "soldier": drawSoldier(e.x, e.y, e.color, e.walkPhase, 1); break;
      case "heavy":   drawHeavy(e); break;
      case "rocket":  drawRocket(e); break;
      case "tank":    drawTank(e, false, e.stunned>0, false); break;
      case "heavyTank": drawTank(e, false, e.stunned>0, true); break;
      case "apc":     drawAPC(e, false, e.stunned>0); break;
      case "mech":    drawMech(e, false, e.stunned>0); break;
      case "heli":    drawHeli(e, false, false, e.stunned>0); break;
      case "attackHeli": drawHeli(e, false, true, e.stunned>0); break;
      case "para":    drawPara(e); break;
    }
  }

  drawBoss();

  for (const b of state.bullets) drawBullet(b, b.big ? "#fff" : "#ffd54a");
  for (const b of state.eBullets) drawBullet(b, "#ff5252");

  drawPlayer();
  for (const a of state.allies) drawAlly(a);
  drawFX();

  if (state.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, state.flash/16)})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  drawHUD();

  if (state.paused){
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#ffd54a";
    ctx.font = "bold 22px monospace";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W/2, H/2);
  }
  if (state.screen === "over"){
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, H/2 - 50, W, 100);
    ctx.fillStyle = "#ff5252";
    ctx.font = "bold 24px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", W/2, H/2 - 10);
    ctx.fillStyle = "#eee";
    ctx.font = "12px monospace";
    ctx.fillText("SCORE: " + state.score, W/2, H/2 + 14);
    ctx.fillText("Press R to restart", W/2, H/2 + 32);
  }
  if (state.screen === "clear"){
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, H/2 - 60, W, 120);
    ctx.fillStyle = "#ffd54a";
    ctx.font = "bold 24px monospace";
    ctx.textAlign = "center";
    ctx.fillText("MISSION COMPLETE", W/2, H/2 - 18);
    ctx.fillStyle = "#9ef";
    ctx.font = "12px monospace";
    ctx.fillText("FINAL SCORE: " + state.score, W/2, H/2 + 8);
    ctx.fillText("Press R to play again", W/2, H/2 + 28);
  }
}

// ---------- Loop ----------
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

})();

// Register service worker for installable PWA / offline play
if ("serviceWorker" in navigator){
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// Surface a custom install prompt on supported browsers
let _deferredInstall = null;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  _deferredInstall = e;
  const btn = document.getElementById("installBtn");
  if (btn){
    btn.style.display = "inline-block";
    btn.onclick = async () => {
      btn.style.display = "none";
      _deferredInstall.prompt();
      _deferredInstall = null;
    };
  }
});
addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});
</script>
