  }
  #wrap {
    position: relative;
    padding: 4px;
    background: linear-gradient(180deg,#444,#111);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.7), inset 0 0 0 2px #222;
    /* Scale canvas to fit viewport while keeping aspect ratio */
    width: min(96vw, calc((100vh - 220px) * 0.6667));
    aspect-ratio: 360 / 540;
    max-width: 540px;
  }
  canvas {
    display: block; image-rendering: pixelated;
    background: #2a6b2a; border-radius: 4px;

  }
  #help { font-size: 12px; line-height: 1.6; margin: 6px 8px 0; color: #bbb; max-width: 540px; text-align: center; }
  kbd { background:#222; color:#ffd54a; padding:1px 6px; border-radius:3px; border:1px solid #555; font-size: 11px; margin: 0 1px; }
  .legend { margin-top: 4px; font-size: 11px; color: #999; }
  .legend b { color:#9ef; }

  /* On-screen touch controls */

    position: fixed; left: 0; right: 0; bottom: 0;

  .pad {
    position: absolute; bottom: 16px;
    pointer-events: auto;
  }
  #dpad {

(() => {
"use strict";

const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
const W = cvs.width, H = cvs.height;

// ---------- Input ----------
const keys = Object.create(null);
const pressed = Object.create(null);
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// ---------- Touch / Virtual Controls ----------
function setKey(name, down){
  if (down){
    if (!keys[name]) pressed[name] = true;
    keys[name] = true;
  } else {
    keys[name] = false;
  }
}

(function setupTouch(){
  const dpad = document.getElementById("dpad");
  const stick = document.getElementById("stick");
  if (!dpad) return;

  const dpadKeys = ["arrowleft","arrowright","arrowup","arrowdown"];
  let dpadId = null;
  function clearDpad(){
    for (const k of dpadKeys) setKey(k, false);
    stick.style.transform = "translate(0,0)";
  }
  function updateStick(clientX, clientY){
    const r = dpad.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const max = r.width/2 - 12;
    const d = Math.hypot(dx,dy);
    if (d > max){ dx = dx/d*max; dy = dy/d*max; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    const dz = 14;
    setKey("arrowleft",  dx < -dz);
    setKey("arrowright", dx >  dz);
    setKey("arrowup",    dy < -dz);
    setKey("arrowdown",  dy >  dz);
  }
  dpad.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    dpadId = t.identifier;
    updateStick(t.clientX, t.clientY);
  }, {passive:false});
  dpad.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const t of e.changedTouches){
      if (t.identifier === dpadId){ updateStick(t.clientX, t.clientY); break; }
    }
  }, {passive:false});
  function endDpad(e){
    for (const t of e.changedTouches){
      if (t.identifier === dpadId){ dpadId = null; clearDpad(); break; }
    }
  }
  dpad.addEventListener("touchend", e => { e.preventDefault(); endDpad(e); }, {passive:false});
  dpad.addEventListener("touchcancel", e => { e.preventDefault(); endDpad(e); }, {passive:false});

  function bindBtn(id, key){
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener("touchstart", e => { e.preventDefault(); setKey(key, true); el.classList.add("active"); }, {passive:false});
    const up = e => { e.preventDefault(); setKey(key, false); el.classList.remove("active"); };
    el.addEventListener("touchend", up, {passive:false});
    el.addEventListener("touchcancel", up, {passive:false});
    // Mouse fallback for desktop testing
    el.addEventListener("mousedown", e => { e.preventDefault(); setKey(key, true); el.classList.add("active"); });
    el.addEventListener("mouseup",   e => { e.preventDefault(); setKey(key, false); el.classList.remove("active"); });
    el.addEventListener("mouseleave",e => { setKey(key, false); el.classList.remove("active"); });
  }
  bindBtn("btnZ", "z");
  bindBtn("btnX", "x");
  bindBtn("btnP", "p");

  // Top buttons
  const muteBtn = document.getElementById("muteBtn");
  if (muteBtn) muteBtn.addEventListener("click", () => { setKey("m", true); setTimeout(()=>setKey("m",false), 50); });
  const fsBtn = document.getElementById("fsBtn");
  if (fsBtn) fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
})();

const audio = (() => {
  let actx = null;
  let master = null;
  let muted = false;
  let bgmTimer = null;

  let bgmTempo = 130; // ms per 16th note

  function ensure(){
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.35;
    master.connect(actx.destination);
  }
  function resume(){
    ensure();
    if (actx && actx.state === "suspended") actx.resume();
  }

  function tone({freq=440, type="square", dur=0.1, vol=0.3, attack=0.005, release=0.05, sweep=0, pan=0}){
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (sweep) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.linearRampToValueAtTime(0, t + dur + release);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + release + 0.02);
  }

  function noiseBurst({dur=0.15, vol=0.4, freq=2000, q=1, sweep=-1500}){
    if (!actx || muted) return;
    const t = actx.currentTime;
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.setValueAtTime(freq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(80, freq + sweep), t + dur);
    f.Q.value = q;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);

  function noteFreq(name){
    if (name === "_") return 0;
    const map = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    const m = name.match(/^([A-G])(#?)(-?\d)$/);
    if (!m) return 0;
    let n = map[m[1]] + (m[2] === "#" ? 1 : 0);
    const oct = parseInt(m[3], 10);
    const midi = 12*(oct+1) + n;
    return 440 * Math.pow(2, (midi-69)/12);
  }
  function drumHit(kind, vol=0.4){
    if (!actx || muted) return;
    if (kind === "K"){
      // Kick: low sine sweep
      tone({freq:140, type:"sine", dur:0.10, vol:vol*0.95, sweep:-100, attack:0.002, release:0.04});
      tone({freq:60,  type:"sine", dur:0.12, vol:vol*0.7, sweep:-30, attack:0.002, release:0.04});
    } else if (kind === "S"){
      // Snare: noise + tone body
      noiseBurst({dur:0.10, vol:vol*0.45, freq:1800, q:0.8, sweep:-600});
      tone({freq:220, type:"triangle", dur:0.06, vol:vol*0.25, sweep:-120});
    } else if (kind === "H"){
      // Closed hi-hat
      noiseBurst({dur:0.04, vol:vol*0.18, freq:8000, q:6, sweep:0});
    } else if (kind === "O"){
      // Open hi-hat
      noiseBurst({dur:0.18, vol:vol*0.14, freq:7500, q:4, sweep:-1500});
    }
  }
  function startBgm(stage){
    if (!actx || muted) return;
    stopBgm();
    bgmStage = stage;
    bgmStep = 0;
    const cfg = stageBgm[stage] || stageBgm[1];
    bgmTempo = cfg.tempo;
    const tick = () => {
      if (muted){ bgmTimer = null; return; }
      const len = cfg.bass.length;
      const i = bgmStep % len;
      const bar = Math.floor(bgmStep / len) % 4; // 4-bar phrase variation
      const stepDur = bgmTempo/1000;
      // Bass — triangle
      const bf = noteFreq(cfg.bass[i]);
      if (bf) tone({freq:bf, type:"triangle", dur:stepDur*0.92, vol:0.20, attack:0.005, release:0.04});
      // Lead — square pulse
      const lf = noteFreq(cfg.lead[i]);
      if (lf) tone({freq:lf, type:"square", dur:stepDur*0.78, vol:0.10, attack:0.003, release:0.03});
      // Harmony — softer square one octave shifted
      const hf = noteFreq(cfg.harm[i]);
      if (hf) tone({freq:hf, type:"square", dur:stepDur*0.65, vol:0.06, attack:0.005, release:0.05});
      // Drum
      const d = cfg.drum[i];
      if (d && d !== "_") drumHit(d, 0.45);
      // Ad-lib: every 4th bar add a fill on last 4 steps
      if (bar === 3 && i >= len-4){
        if (i % 2 === 0){
          tone({freq:880 + (i-len+4)*120, type:"square", dur:stepDur*0.4, vol:0.07});
        }
        if (i === len-1) drumHit("O", 0.6);
      }
      // Arp on top — gentle, only when not on a rest
      if (lf && bar % 2 === 1){
        const arp = lf * 2;
        tone({freq:arp, type:"square", dur:stepDur*0.18, vol:0.04, attack:0.001, release:0.02});
      }
      bgmStep++;
      bgmTimer = setTimeout(tick, bgmTempo);
    };
    tick();
  }
  function stopBgm(){
    if (bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  }
  function setMuted(m){
    muted = m;
    if (muted) stopBgm();
  }
  function isMuted(){ return muted; }

  return {
    resume, ensure,
    sfxShoot, sfxTankShot, sfxGrenadeThrow, sfxExplosion,
    sfxEnemyShoot, sfxHit, sfxPlayerHit, sfxBoard,
    sfxPickup, sfxOneUp, sfxBossWarn, sfxBossExplode,
    sfxStageStart, sfxGameOver,
    startBgm, stopBgm, setMuted, isMuted,
  };
})();

// ---------- Helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
const irand = (a,b) => Math.floor(rand(a,b));
function aabb(a,b){
  return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2;
}
function addExplosion(x,y,size=1){
  if (size >= 1.0) audio.sfxExplosion(size >= 1.5);
  else audio.sfxHit();
  const n = Math.floor(8 + size*10);
  for (let i=0;i<n;i++){
    state.fx.push({
      kind:"spark",
      x, y,
      vx: rand(-3,3)*size, vy: rand(-3,3)*size,
      life: irand(16,32),
      r: rand(2, 3+size*2),
      c: ["#ffd54a","#ff7043","#fff","#bf360c","#ffeb3b"][irand(0,5)],
    });
  }
  state.fx.push({ kind:"ring", x, y, life: 16, r: 2, max: 14*size, c:"#ffeb3b" });
  state.fx.push({ kind:"ring", x, y, life: 22, r: 2, max: 22*size, c:"#fff" });
  state.flash = Math.max(state.flash, 4*size);
  state.shake = Math.max(state.shake, 4*size);
  for (let i=0;i<6;i++){
    state.smoke.push({
      x, y, vx: rand(-0.6,0.6), vy: rand(-1.5,-0.4),
      life: irand(40,80), r: rand(4,7+size*2),
    });
  }
}

function spawnBoss(){
  const stage = state.stage;
  const proto = BOSS_ARCHETYPES[stage] || BOSS_ARCHETYPES[6];
  const sizeMul = proto.sizeMul;
  const w = Math.floor(proto.w);
  const h = Math.floor(proto.h);
  const baseHp = 25 + (stage-1) * 18;
  state.boss = {
    type:"boss",
    archetype: stage,
    shape: proto.shape,
    name: proto.name,
    x: W/2, y: -h,
    w, h,
    sizeMul,
    targetY: 30 + h/2,
    hp: baseHp,
    maxHp: baseHp,
    shotCd: 90,
    moveT: 0,
    phase: 0,
    parts: proto.parts.map(p => ({
      name: p.name, ox: p.ox, oy: p.oy,
      hp: p.hpMax, max: p.hpMax,
      shotCd: p.shotCd,
      w: p.w * sizeMul, h: p.h * sizeMul,
    })),
    introT: 0,
  };
  state.bossActive = true;
  state.shake = 12;
  audio.sfxBossWarn();
}
function bossPartWorldPos(boss, part){
  return { x: boss.x + part.ox * boss.w, y: boss.y + part.oy * boss.h, w: part.w, h: part.h };
}

// ---------- Update ----------
function update(){
  state.t++;

  if (state.screen === "title"){
    if (pressed.z || pressed["enter"] || pressed[" "]){
      state.screen = "play";
      state.stageBanner = 120;
      audio.sfxStageStart();
      audio.startBgm(state.stage);
    }
    if (pressed.m){ audio.setMuted(!audio.isMuted()); if (!audio.isMuted()) audio.startBgm(state.stage); }
    return;
  }
  if (state.screen === "over" || state.screen === "clear"){
    if (pressed.r){ reset(); }
    if (pressed.m){ audio.setMuted(!audio.isMuted()); }
    return;
  }
  if (pressed.p){
    state.paused = !state.paused;
    if (state.paused) audio.stopBgm();
    else audio.startBgm(state.stage);
  }
  if (pressed.m){
    audio.setMuted(!audio.isMuted());
    if (!audio.isMuted() && !state.paused) audio.startBgm(state.stage);
  }
  if (state.paused) return;

  state.scroll += 0.7;
  state.stageTimer++;
  if (state.stageBanner > 0) state.stageBanner--;

  // Boss spawn check
  const bossAt = 60*45; // ~45s per stage
  if (!state.bossActive && state.boss === null && state.stageTimer > bossAt){
    spawnBoss();
  }

  // Spawning rhythm
  const diff = 1 + Math.min(3, state.score / 5000) + (state.stage-1)*0.5;
  state.spawnTimer--;
  if (!state.bossActive && state.stageTimer < bossAt && state.spawnTimer <= 0){
    const r = Math.random();
    const stage = state.stage;
    if (stage === 1){
      if (r<0.55) spawnSoldier();
      else if (r<0.85) spawnTank();
      else spawnHeavySoldier();
    } else if (stage === 2){
      if (r<0.35) spawnSoldier();
      else if (r<0.55) spawnHeavySoldier();
      else if (r<0.7) spawnRocketSoldier();
      else if (r<0.85) spawnTank();
      else spawnAPC();
    } else {
      if (r<0.25) spawnSoldier();
      else if (r<0.4) spawnHeavySoldier();
      else if (r<0.55) spawnRocketSoldier();
      else if (r<0.7) spawnTank();
      else if (r<0.82) spawnHeavyTank();
      else if (r<0.92) spawnAPC();
      else spawnMech();
    }
    state.spawnTimer = Math.max(60, 130 - diff*8) + irand(0,30);
  }
  state.heliTimer--;
  if (!state.bossActive && state.heliTimer <= 0){
    if (state.stage >= 2 && Math.random() < 0.3) spawnHeli(true);
    else spawnHeli(false);
    state.heliTimer = irand(540, 800);
  }
  // POW (rescuable allies) — spawn often
  state.powTimer--;
  if (!state.bossActive && state.powTimer <= 0){
    spawnPOW();
    state.powTimer = irand(280, 480);
  }

  // Player
  const p = state.player;
  if (p.invuln > 0) p.invuln--;
  if (p.muzzle > 0) p.muzzle--;
  if (p.blastCd > 0) p.blastCd--;
  if (p.blastFx > 0) p.blastFx--;
  let dx=0, dy=0;
  if (keys["arrowleft"]||keys["a"]) dx -= 1;
  if (keys["arrowright"]||keys["d"]) dx += 1;
  if (keys["arrowup"]||keys["w"]) dy -= 1;
  if (keys["arrowdown"]||keys["s"]) dy += 1;
  let speed;
  switch(p.mode){
    case "tank": speed = 1.4; break;
    case "heli": speed = 2.6; break;
    case "mech": speed = 1.6; break;
    case "apc":  speed = 2.4; break;
    default:     speed = 2.0;
  }
  if (dx||dy){
    const m = Math.hypot(dx,dy);
    p.x += (dx/m)*speed;
    p.y += (dy/m)*speed;
    p.dir = Math.atan2(dy, dx);
    p.walkPhase += 0.25;
  }
  p.x = Math.max(8, Math.min(W-8, p.x));
  p.y = Math.max(20, Math.min(H-12, p.y));

  // Shoot
  if (p.shotCd > 0) p.shotCd--;
  if (keys["z"] && p.shotCd <= 0){
    if (p.mode === "tank"){
      state.bullets.push({x:p.x-3, y:p.y-12, vx:0, vy:-6, w:4, h:8, big:true, dmg:2});
      state.bullets.push({x:p.x+3, y:p.y-12, vx:0, vy:-6, w:4, h:8, big:true, dmg:2});
      addMuzzle(p.x, p.y-14, -Math.PI/2);
      audio.sfxTankShot();
      p.shotCd = 14; p.muzzle = 4;
    } else if (p.mode === "heli"){
      // Spread shot
      state.bullets.push({x:p.x, y:p.y-8, vx:0, vy:-7, w:3, h:7, dmg:1});
      state.bullets.push({x:p.x-5, y:p.y-6, vx:-1.2, vy:-6.5, w:3, h:6, dmg:1});
      state.bullets.push({x:p.x+5, y:p.y-6, vx:1.2, vy:-6.5, w:3, h:6, dmg:1});
      addMuzzle(p.x, p.y-8, -Math.PI/2);
      audio.sfxShoot();
      p.shotCd = 6; p.muzzle = 3;
    } else if (p.mode === "mech"){
      // Rapid heavy MG
      state.bullets.push({x:p.x-4, y:p.y-10, vx:rand(-0.3,0.3), vy:-7, w:3, h:6, dmg:1});
      state.bullets.push({x:p.x+4, y:p.y-10, vx:rand(-0.3,0.3), vy:-7, w:3, h:6, dmg:1});
      addMuzzle(p.x, p.y-10, -Math.PI/2);
      audio.sfxShoot();
      p.shotCd = 4; p.muzzle = 2;
    } else if (p.mode === "apc"){
      // Twin MG
      state.bullets.push({x:p.x-4, y:p.y-10, vx:0, vy:-6, w:3, h:6, dmg:1});
      state.bullets.push({x:p.x+4, y:p.y-10, vx:0, vy:-6, w:3, h:6, dmg:1});
      addMuzzle(p.x, p.y-10, -Math.PI/2);
      audio.sfxShoot();
      p.shotCd = 7; p.muzzle = 3;
    } else {
      state.bullets.push({x:p.x, y:p.y-10, vx:0, vy:-5.5, w:3, h:6, dmg:1});
      addMuzzle(p.x, p.y-12, -Math.PI/2);
      audio.sfxShoot();
      p.shotCd = 8; p.muzzle = 3;
    }
  }
  // Support Blast (X) — clears bullets, heals, stuns vehicles for capture
  if (pressed.x && p.blastCd <= 0 && p.blastStock > 0){
    p.blastStock--;
    p.blastCd = 30;
    p.blastFx = 50;
    audio.sfxExplosion(true);
    audio.sfxBoard();
    state.flash = Math.max(state.flash, 8);
    // Clear all enemy bullets on screen
    for (const b of state.eBullets) b.dead = true;
    state.eBullets = state.eBullets.filter(b => !b.dead);
    // Heal self +2 HP
    p.hp = Math.min(p.maxHp, p.hp + 2);
    spawnFloater(p.x, p.y - 14, "+2 HP", "#4caf50");
    // Heal allies fully + grant invuln
    for (const a of state.allies){
      a.hp = a.maxHp || 5;
      a.invuln = 90;
    }
    if (state.allies.length > 0) spawnFloater(p.x, p.y, "ALLIES HEALED", "#64b5f6");
    // Stun ALL non-boss boardable vehicles for boarding
    for (const e of state.enemies){
      if (e.boardable){
        e.stunned = Math.max(e.stunned||0, 360);
      }
    }
    // Damage to boss parts (light)
    if (state.boss){
      for (const part of state.boss.parts){
        if (part.hp > 0) part.hp = Math.max(0, part.hp - 1);
      }
    }
  }

  // Bullets
  for (const b of state.bullets){ b.x += b.vx; b.y += b.vy; }
  state.bullets = state.bullets.filter(b => b.y > -10 && b.y < H+10 && b.x > -10 && b.x < W+10);
  for (const b of state.eBullets){
    b.x += b.vx; b.y += b.vy;
    if (b.kind === "rocket"){
      b.smokeT = (b.smokeT||0) - 1;
      if (b.smokeT <= 0){
        state.smoke.push({x:b.x, y:b.y, vx:rand(-0.2,0.2), vy:rand(-0.2,0.2), life:irand(20,40), r:3});
        b.smokeT = 3;
      }
    }
  }
  state.eBullets = state.eBullets.filter(b => b.y > -10 && b.y < H+10 && b.x > -10 && b.x < W+10);

  // Enemies
  for (const e of state.enemies){
    if (e.type === "soldier" || e.type === "heavy" || e.type === "rocket"){
      e.y += e.vy;
      if (e.x < p.x) e.x += 0.3;
      else if (e.x > p.x) e.x -= 0.3;
      e.walkPhase += 0.2;
      e.shotCd--;
      if (e.shotCd <= 0 && e.y > 0 && e.y < H-40){
        const ang = Math.atan2(p.y-e.y, p.x-e.x);
        if (e.type === "rocket"){
          state.eBullets.push({x:e.x, y:e.y, vx:Math.cos(ang)*1.8, vy:Math.sin(ang)*1.8, w:5, h:5, kind:"rocket", smokeT:0});
          e.shotCd = irand(240, 360);
        } else if (e.type === "heavy"){
          for (let i=-1;i<=1;i++){
            const a = ang + i*0.18;
            state.eBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, w:3, h:3});
          }
          e.shotCd = irand(220, 320);
        } else {
          state.eBullets.push({x:e.x, y:e.y, vx:Math.cos(ang)*2.2, vy:Math.sin(ang)*2.2, w:3, h:3});
          e.shotCd = irand(200, 340);
        }
      }
    } else if (e.type === "tank" || e.type === "heavyTank" || e.type === "apc" || e.type === "mech"){
      if (e.stunned > 0){
        e.stunned--;
      } else {
        e.y += e.vy;
        if (e.type === "mech") e.walkPhase = (e.walkPhase||0) + 0.18;
        e.shotCd--;
        if (e.shotCd <= 0 && e.y > 0 && e.y < H-40){
          const ang = Math.atan2(p.y-e.y, p.x-e.x);
          if (e.type === "heavyTank"){
            for (let i=-1;i<=1;i++){
              const a = ang + i*0.12;
              state.eBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*2.6, vy:Math.sin(a)*2.6, w:4, h:4});
            }
            e.shotCd = irand(140, 200);
          } else if (e.type === "mech"){
            state.eBullets.push({x:e.x-6, y:e.y, vx:Math.cos(ang)*3, vy:Math.sin(ang)*3, w:3, h:3});
            state.eBullets.push({x:e.x+6, y:e.y, vx:Math.cos(ang)*3, vy:Math.sin(ang)*3, w:3, h:3});
            e.shotCd = irand(140, 220);
          } else {
            state.eBullets.push({x:e.x, y:e.y, vx:Math.cos(ang)*2.6, vy:Math.sin(ang)*2.6, w:4, h:4});
            e.shotCd = irand(140, 220);
          }
        }
      }
    } else if (e.type === "heli" || e.type === "attackHeli"){
      if (e.stunned > 0){
        e.stunned--;
        e.y += 0.5; // descend while stunned
      } else {
        e.x += e.vx;
        e.bladePhase += 0.6;
        if (e.type === "heli"){
          e.dropCd--;
          if (e.dropCd <= 0 && e.drops > 0 && e.x > 10 && e.x < W-10){
            spawnPara(e.x, e.y+8);
            e.drops--;
            e.dropCd = 50;
          }
        } else {
          e.shotCd--;
          if (e.shotCd <= 0 && e.x > 0 && e.x < W){
            const ang = Math.atan2(p.y-e.y, p.x-e.x);
            state.eBullets.push({x:e.x, y:e.y+6, vx:Math.cos(ang)*3, vy:Math.sin(ang)*3, w:4, h:4});
            e.shotCd = irand(140, 220);
          }
        }
      }
    } else if (e.type === "para"){
      e.y += e.vy;
      if (!e.landed && e.y > H - 100){
        e.landed = true;
        e.type = "soldier";
        e.shotCd = 90;
        e.walkPhase = 0;
        e.vy = 0.7;
      }
    }
  }

  // Boss
  if (state.boss){
    const b = state.boss;
    b.moveT++;
    b.introT++;
    if (b.y < b.targetY){
      b.y += 0.6;
    } else {
      b.x = W/2 + Math.sin(b.moveT*0.018) * (W/2 - 60);
      // slight bobbing for menace
      b.y = b.targetY + Math.sin(b.moveT*0.04) * 4;
    }
    // Core fires — pattern depends on boss archetype
    b.shotCd--;
    const phase = b.hp < b.maxHp*0.5 ? 1 : 0;
    const arche = b.archetype || 1;
    if (b.shotCd <= 0 && b.y >= b.targetY - 4){
      const ang = Math.atan2(p.y-b.y, p.x-b.x);
      switch (arche){
        case 1: { // FORTRESS — wide arc / enraged spread+rocket
          if (phase === 0){
            for (let i=0;i<7;i++){
              const a = Math.PI/2 + (i-3)*0.16;
              state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(a)*2.6, vy:Math.sin(a)*2.6, w:4, h:4});
            }
            b.shotCd = 60;
          } else {
            for (let i=-3;i<=3;i++){
              const a = ang + i*0.12;
              state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(a)*3, vy:Math.sin(a)*3, w:4, h:4});
            }
            state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(ang)*1.6, vy:Math.sin(ang)*1.6, w:6, h:6, kind:"rocket", smokeT:0});
            b.shotCd = 45;
          }
          break;
        }
        case 2: { // SAND CRAB — radial barrage from body
          const n = phase ? 12 : 8;
          for (let i=0;i<n;i++){
            const a = (i / n) * Math.PI * 2 + b.moveT*0.01;
            state.eBullets.push({x:b.x, y:b.y, vx:Math.cos(a)*2.2, vy:Math.sin(a)*2.2, w:4, h:4});
          }
          b.shotCd = phase ? 50 : 80;
          break;
        }
        case 3: { // SKY CARRIER — bomb drops + paratroopers
          for (let i=-2;i<=2;i++){
            state.eBullets.push({x:b.x + i*30, y:b.y+b.h*0.4, vx:0, vy:3, w:6, h:6, kind:"rocket", smokeT:0});
          }
          // Drop a paratrooper
          if (b.moveT % 80 < 5){ spawnPara(b.x + rand(-50, 50), b.y + b.h*0.3); }
          b.shotCd = phase ? 40 : 70;
          break;
        }
        case 4: { // GLACIER WALKER — stomping shockwaves (radial rings)
          if (phase === 0){
            for (let i=0;i<10;i++){
              const a = (i/10)*Math.PI*2;
              state.eBullets.push({x:b.x, y:b.y+b.h*0.4, vx:Math.cos(a)*2.0, vy:Math.sin(a)*2.0, w:5, h:5});
            }
            b.shotCd = 90;
          } else {
            for (let r=0;r<2;r++){
              for (let i=0;i<14;i++){
                const a = (i/14)*Math.PI*2 + r*0.22;
                state.eBullets.push({x:b.x, y:b.y+b.h*0.4, vx:Math.cos(a)*(2.0+r*0.6), vy:Math.sin(a)*(2.0+r*0.6), w:5, h:5});
              }
            }
            b.shotCd = 80;
          }
          state.shake = Math.max(state.shake, 6);
          break;
        }
        case 5: { // INFERNO TRAIN — heavy single artillery + side spread
          state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(ang)*1.4, vy:Math.sin(ang)*1.4, w:8, h:8, kind:"rocket", smokeT:0});
          for (let i=-2;i<=2;i++){
            const a = Math.PI/2 + i*0.22;
            state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, w:4, h:4});
          }
          b.shotCd = phase ? 35 : 55;
          break;
        }
        case 6: { // OMEGA OVERLORD — multi-layer attacks
          // Spiral
          for (let i=0;i<6;i++){
            const a = Math.PI/2 + (i-2.5)*0.18 + Math.sin(b.moveT*0.05);
            state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(a)*2.8, vy:Math.sin(a)*2.8, w:4, h:4});
          }
          // Aimed homing-ish twin
          for (let s of [-1, 1]){
            const a = ang + s*0.05;
            state.eBullets.push({x:b.x + s*40, y:b.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3, w:5, h:5});
          }
          // Phase 2: extra heavy rocket every other shot
          if (phase && (b.moveT % 60 < 5)){
            state.eBullets.push({x:b.x, y:b.y+b.h*0.3, vx:Math.cos(ang)*1.4, vy:Math.sin(ang)*1.4, w:8, h:8, kind:"rocket", smokeT:0});
          }
          b.shotCd = phase ? 30 : 50;
          break;
        }
      }
    }
    // Sub-turrets fire independently — pattern by part name suffix
    for (const part of b.parts){
      if (part.hp <= 0) continue;
      part.shotCd--;
      if (part.shotCd <= 0){
        const wp = bossPartWorldPos(b, part);
        const ang = Math.atan2(p.y - wp.y, p.x - wp.x);
        const yOff = wp.h/2;
        if (part.name === "TOP_GUN"){
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang)*3.2, vy:Math.sin(ang)*3.2, w:3, h:3});
          part.shotCd = 24;
        } else if (part.name === "L_CLAW" || part.name === "R_CLAW"){
          // Pincer: 5-way claw fan
          for (let i=-2;i<=2;i++){
            const a = ang + i*0.13;
            state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, w:4, h:4});
          }
          part.shotCd = 110;
        } else if (part.name === "L_POD" || part.name === "R_POD"){
          // Carrier pods: rapid AA stream
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang)*3, vy:Math.sin(ang)*3, w:3, h:3});
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang+0.1)*3, vy:Math.sin(ang+0.1)*3, w:3, h:3});
          part.shotCd = 16;
        } else if (part.name === "BAY"){
          // Bomb drop
          for (let i=-1;i<=1;i++){
            state.eBullets.push({x:wp.x + i*14, y:wp.y, vx:0, vy:3, w:6, h:6, kind:"rocket", smokeT:0});
          }
          part.shotCd = 90;
        } else if (part.name === "L_GUN" || part.name === "R_GUN"){
          // Walker arm gatling
          for (let i=0;i<3;i++){
            state.eBullets.push({x:wp.x + irand(-3,3), y:wp.y+yOff, vx:Math.cos(ang)*3.2, vy:Math.sin(ang)*3.2, w:3, h:3});
          }
          part.shotCd = 28;
        } else if (part.name === "CHEST"){
          // Walker chest beam (line of bullets)
          for (let i=0;i<5;i++){
            state.eBullets.push({x:wp.x, y:wp.y+yOff + i*4, vx:Math.cos(ang)*3.5, vy:Math.sin(ang)*3.5, w:5, h:5});
          }
          part.shotCd = 140;
        } else if (part.name === "FRONT_GUN" || part.name === "MID_GUN" || part.name === "REAR_GUN"){
          // Train turret fan
          for (let i=-1;i<=1;i++){
            const a = ang + i*0.14;
            state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(a)*2.6, vy:Math.sin(a)*2.6, w:4, h:4});
          }
          part.shotCd = 70;
        } else if (part.name === "L_BLADE" || part.name === "R_BLADE"){
          // Overlord blades: side sweeps
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang)*3.5, vy:Math.sin(ang)*3.5, w:5, h:5});
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang+0.2)*3, vy:Math.sin(ang+0.2)*3, w:4, h:4});
          part.shotCd = 40;
        } else if (part.name === "L_SHOULD" || part.name === "R_SHOULD"){
          // Overlord shoulders: heavy rockets
          state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(ang)*1.6, vy:Math.sin(ang)*1.6, w:6, h:6, kind:"rocket", smokeT:0});
          part.shotCd = 90;
        } else {
          // Generic 3-way
          for (let i=-1;i<=1;i++){
            const a = ang + i*0.18;
            state.eBullets.push({x:wp.x, y:wp.y+yOff, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, w:4, h:4});
          }
          part.shotCd = 90 + irand(-15,15);
        }
      }
    }
    if (b.hp <= 0){
      // multi-stage explosion
      for (let i=0;i<10;i++){
        state.fx.push({
          kind:"spark",
          x: b.x + rand(-b.w/2, b.w/2),
          y: b.y + rand(-b.h/2, b.h/2),
          vx: rand(-4,4), vy: rand(-4,4),
          life: irand(20,50), r: rand(3,8),
          c: ["#ffd54a","#ff7043","#fff","#bf360c"][irand(0,4)],
        });
      }
      addExplosion(b.x, b.y, 4);
      audio.sfxBossExplode();
      state.score += 5000 + state.stage * 2000;
      state.boss = null;
      state.bossActive = false;
      state.stage++;
      state.stageTimer = 0;
      state.stageBanner = 180;
      if (state.stage > 6){
        state.screen = "clear";
        audio.stopBgm();
      } else {
        audio.sfxStageStart();
        audio.startBgm(state.stage);
      }
    }
  }

  // Collisions: player bullets → enemies (and boss)
  const targets = [...state.enemies];
  if (state.boss) targets.push(state.boss);
  for (const bu of state.bullets){
    // Boss sub-parts get checked first (they shield the core)
    if (state.boss){
      let hitPart = null;
      for (const part of state.boss.parts){
        if (part.hp <= 0) continue;
        const wp = bossPartWorldPos(state.boss, part);
        if (aabb(bu, wp)){ hitPart = part; break; }
      }
      if (hitPart){
        bu.dead = true;
        hitPart.hp -= bu.dmg || 1;
        addExplosion(bu.x, bu.y, 0.5);
        if (hitPart.hp <= 0){
          const wp = bossPartWorldPos(state.boss, hitPart);
          addExplosion(wp.x, wp.y, 1.8);
          state.score += 800;
        }
        continue;
      }
    }
    for (const e of targets){
      if (e.hp <= 0) continue;
      if (aabb(bu, e)){
        bu.dead = true;
        const dmg = bu.dmg || 1;
        if ((e.type === "tank" || e.type === "heavyTank") && e.stunned <= 0 && !bu.big){
          e.hp -= dmg*0.5;
        } else if (e.type === "boss"){
          const aliveParts = e.parts.filter(p => p.hp > 0).length;
          e.hp -= dmg * (aliveParts > 0 ? 0.4 : 1.5);
        } else {
          e.hp -= dmg;
        }
        addExplosion(bu.x, bu.y, 0.4);
        // Damage-based stun: boardable vehicles auto-stun when very low HP
        if (e.boardable && e.hp > 0 && e.hp <= 1.5 && (e.stunned||0) < 60){
          e.stunned = 360;
          spawnFloater(e.x, e.y - 12, "STUN!", "#ffeb3b");
        }
        if (e.hp <= 0 && e.type !== "boss"){
          let pts = 100;
          if (e.type==="tank") pts = 500;
          else if (e.type==="heavyTank") pts = 900;
          else if (e.type==="apc") pts = 400;
          else if (e.type==="mech") pts = 700;
          else if (e.type==="heli") pts = 600;
          else if (e.type==="attackHeli") pts = 1000;
          else if (e.type==="heavy") pts = 200;
          else if (e.type==="rocket") pts = 250;
          state.score += pts;
          addExplosion(e.x, e.y, e.boardable ? 1.6 : 1);
          // chance to drop item
          if (Math.random() < 0.4){
            const r = Math.random();
            const kind = r < 0.5 ? "medkit" : (r < 0.85 ? "blast" : "life");
            state.items.push({x:e.x, y:e.y, w:14, h:14, kind, life: 600});
          }
        }
        break;
      }
    }
  }
  state.bullets = state.bullets.filter(b => !b.dead);
  state.enemies = state.enemies.filter(e => e.hp > 0 && e.y < H + 30 && e.x > -50 && e.x < W+50);

  // Items pickup — magnet effect + huge pickup radius
  for (const it of state.items){
    it.life--;
    if (it.kind === "pow"){
      if (it.y < H - 120) it.y += it.vy;
      it.bob = (it.bob||0) + 0.1;
    }
    // Magnet: pull items toward player when nearby (except POW which stays put)
    if (it.kind !== "pow"){
      const d = Math.hypot(it.x - p.x, it.y - p.y);
      if (d < 90 && d > 0.5){
        const pull = 1.6;
        it.x += (p.x - it.x) / d * pull;
        it.y += (p.y - it.y) / d * pull;
      }
    }
    const pickupR = it.kind === "pow" ? 22 : 28;
    if (Math.hypot(it.x - p.x, it.y - p.y) < pickupR){
      if (it.kind === "blast"){
        p.blastStock = Math.min(6, p.blastStock+1);
        state.score += 80;
        audio.sfxPickup();
        spawnFloater(it.x, it.y, "+1 BLAST", "#ffd54a");
      } else if (it.kind === "medkit"){
        const before = p.hp;
        p.hp = Math.min(p.maxHp, p.hp + 2);
        state.score += 100;
        audio.sfxPickup();
        spawnFloater(it.x, it.y, "+" + (p.hp - before) + " HP", "#4caf50");
      } else if (it.kind === "life"){
        p.lives++;
        p.hp = p.maxHp;
        state.score += 200;
        audio.sfxOneUp();
        spawnFloater(it.x, it.y, "1UP!", "#ff4081");
      } else if (it.kind === "pow"){
        recruitAlly(it.x, it.y);
        state.score += 300;
        spawnFloater(it.x, it.y, "JOINED!", "#64b5f6");
      }
      it.life = 0;
    }
  }
  state.items = state.items.filter(i => i.life > 0);

  // Allies — follow player at offsets, auto-shoot, regen when safe
  for (let i = 0; i < state.allies.length; i++){
    const a = state.allies[i];
    if (a.invuln > 0) a.invuln--;
    a.safeT++;
    // HP regen: if not hit for 3s, slowly regen up to maxHp
    if (a.safeT > 180 && a.hp < (a.maxHp||5)){
      a.regenT = (a.regenT||0) + 1;
      if (a.regenT >= 120){
        a.hp = Math.min(a.maxHp||5, a.hp + 1);
        a.regenT = 0;
        spawnFloater(a.x, a.y - 14, "+1", "#4caf50");
      }
    } else {
      a.regenT = 0;
    }
    // Target offset position
    const angle = (i - (state.allies.length-1)/2) * 0.6;
    const dist = 26 + (i%2)*8;
    a.targetX = p.x + Math.sin(angle) * dist;
    a.targetY = p.y + 22 + Math.cos(angle) * 6;
    const dx = a.targetX - a.x, dy = a.targetY - a.y;
    const d = Math.hypot(dx, dy);
    if (d > 1){
      const sp = Math.min(2.5, d * 0.15);
      a.x += (dx/d) * sp;
      a.y += (dy/d) * sp;
      a.walkPhase += 0.2;
    }
    a.x = Math.max(8, Math.min(W-8, a.x));
    a.y = Math.max(20, Math.min(H-12, a.y));
    // Bullet-dodging: small lateral drift away from incoming enemy bullets
    let dodgeX = 0;
    for (const b of state.eBullets){
      const dxb = a.x - b.x, dyb = a.y - b.y;
      if (dyb > 0 && dyb < 50 && Math.abs(dxb) < 18){
        dodgeX += (dxb >= 0 ? 0.5 : -0.5);
      }
    }
    a.x += Math.max(-1.2, Math.min(1.2, dodgeX));
    // Auto-fire
    a.shotCd--;
    if (a.shotCd <= 0){
      let best = null, bestD = 9999;
      for (const e of state.enemies){
        if (e.hp <= 0) continue;
        if (e.y > a.y) continue;
        const d = Math.hypot(e.x - a.x, e.y - a.y);
        if (d < bestD){ bestD = d; best = e; }
      }
      if (best || state.boss){
        const tx = best ? best.x : state.boss.x;
        const ty = best ? best.y : state.boss.y;
        const ang = Math.atan2(ty - a.y, tx - a.x);
        state.bullets.push({
          x: a.x, y: a.y - 8,
          vx: Math.cos(ang)*5, vy: Math.sin(ang)*5,
          w: 3, h: 5, dmg: 1, ally: true,
        });
      }
      a.shotCd = 24;
    }
    // Hit by enemy bullet — long invuln
    if (a.invuln <= 0){
      for (const b of state.eBullets){
        if (aabb(b, a)){
          a.hp--;
          a.invuln = 75;
          a.safeT = 0;
          b.dead = true;
          addExplosion(a.x, a.y, 0.4);
          spawnFloater(a.x, a.y-12, "-1", "#ff5252");
          break;
        }
      }
    }
  }
  state.allies = state.allies.filter(a => a.hp > 0);

  // Player vs enemy bullets / enemies
  if (p.invuln <= 0){
    for (const b of state.eBullets){
      if (aabb(b, p)){
        if (b.kind === "rocket"){
          addExplosion(b.x, b.y, 1.2);
        }
        hitPlayer();
        b.dead = true;
        break;
      }
    }
    state.eBullets = state.eBullets.filter(b => !b.dead);
    if (p.invuln <= 0){
      for (const e of [...state.enemies, state.boss].filter(Boolean)){
        if (e.hp <= 0) continue;
        if (e.boardable && e.stunned > 0){
          if (aabb(p, e) && p.mode === "foot"){
            // Board!
            switch(e.type){
              case "tank":      p.mode = "tank";  p.vehHp = 9; break;
              case "heavyTank": p.mode = "tank";  p.vehHp = 14; break;
              case "apc":       p.mode = "apc";   p.vehHp = 8; break;
              case "mech":      p.mode = "mech";  p.vehHp = 11; break;
              case "heli":      p.mode = "heli";  p.vehHp = 6; break;
              case "attackHeli":p.mode = "heli";  p.vehHp = 9; break;
            }
            p.invuln = 40;
            e.hp = 0;
            state.score += 500;
            audio.sfxBoard();
            addExplosion(p.x, p.y, 0.8);
          }
        } else if (aabb(p, e)){
          hitPlayer();
          break;
        }
      }
    }
  }

  // FX
  for (const f of state.fx){
    if (f.kind === "spark"){
      f.x += f.vx; f.y += f.vy;
      f.vx *= 0.92; f.vy *= 0.92;
    } else if (f.kind === "ring"){
      f.r += (f.max - f.r) * 0.25;
    }
    f.life--;
  }
  state.fx = state.fx.filter(f => f.life > 0);
  for (const s of state.smoke){
    s.x += s.vx; s.y += s.vy;
    s.vy *= 0.98;
    s.life--;
  }
  state.smoke = state.smoke.filter(s => s.life > 0);
  if (state.flash > 0) state.flash--;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - 0.5);

  // Reset pressed
  for (const k in pressed) pressed[k] = false;
}

function hitPlayer(){
  const p = state.player;
  if (p.mode !== "foot"){
    p.vehHp--;
    p.invuln = 35;
    audio.sfxHit();
    addExplosion(p.x, p.y, 0.6);
    spawnFloater(p.x, p.y-10, "-1", "#ff5252");
    if (p.vehHp <= 0){
      p.mode = "foot";
      p.invuln = 80;
      addExplosion(p.x, p.y, 1.5);
    }
    return;
  }
  // On-foot: lose 1 HP, only lose a life when HP reaches 0
  p.hp--;
  p.invuln = 60;
  audio.sfxHit();
  addExplosion(p.x, p.y, 0.5);
  spawnFloater(p.x, p.y-10, "-1 HP", "#ff5252");
  if (p.hp <= 0){
    // Lose a life
    p.lives--;
    p.invuln = 120;
    audio.sfxPlayerHit();
    addExplosion(p.x, p.y, 1.8);
    if (p.lives < 0){
      state.screen = "over";
      audio.stopBgm();
      audio.sfxGameOver();
    } else {
      p.hp = p.maxHp;
      p.x = W/2; p.y = H - 70;
      p.blastStock = Math.max(p.blastStock, 2);
    }
  }
}

// ---------- Render ----------
function tileColor(stage){
  // [base, stripe, bush]
  if (stage === 1) return ["#2a6b2a","#327f32","#1c4f1c"];           // grass
  if (stage === 2) return ["#7a6437","#8b7345","#594824"];           // desert
  if (stage === 3) return ["#3a3f55","#4a4f6b","#1f2233"];           // night base
  if (stage === 4) return ["#b8c8d8","#cfdde8","#7a8b97"];           // arctic snow
  if (stage === 5) return ["#3a1a14","#5a2618","#7a1a05"];           // volcanic
  return ["#1a1530","#2a2050","#0a0a20"];                            // final sky
}
// Special accents per stage (water/sand band, fire pools, etc.)
function stageAccent(stage){
  if (stage === 1) return { kind:"river" };
  if (stage === 2) return { kind:"sand" };
  if (stage === 3) return { kind:"river" };
  if (stage === 4) return { kind:"ice" };
  if (stage === 5) return { kind:"lava" };
  return { kind:"void" };
}

function drawBackground(){
  const [base, stripe, bush] = tileColor(state.stage);
  ctx.fillStyle = base;
  ctx.fillRect(0,0,W,H);

  // soft horizontal stripes
  ctx.fillStyle = stripe;
  const off = state.scroll % 32;
  for (let y = -32 + off; y < H; y += 32){
    ctx.fillRect(0, y, W, 16);
  }

  // Stage-specific environmental bands
  const accent = stageAccent(state.stage).kind;
  const riverEvery = 360;
  const baseOff = (state.scroll * 0.6) % riverEvery;
  for (let yy = -baseOff; yy < H + 80; yy += riverEvery){
    if (accent === "sand"){
      ctx.fillStyle = "#c2a06a";
      ctx.fillRect(0, yy, W, 50);
      ctx.fillStyle = "#a98449";
      for (let i=0;i<10;i++){
        const xx = ((i*53 + Math.floor(yy))%W);
        ctx.fillRect(xx, yy+rand(2,46), 6, 2);
      }
    } else if (accent === "river"){
      ctx.fillStyle = "#1976d2";
      ctx.fillRect(0, yy, W, 36);
      ctx.fillStyle = "#64b5f6";
      for (let i=0;i<W;i+=12){
        const ph = Math.sin((i+state.t*2)*0.1)*2;
        ctx.fillRect(i, yy+8+ph, 6, 2);
        ctx.fillRect(i+3, yy+22+ph, 5, 2);
      }
      ctx.fillStyle = "#6d4c41";
      ctx.fillRect(W/2-32, yy-2, 64, 40);
      ctx.fillStyle = "#4e342e";
      for (let bx = -2; bx < 64; bx += 8){
        ctx.fillRect(W/2-32+bx, yy-2, 2, 40);
      }
    } else if (accent === "ice"){
      // Frozen lake
      ctx.fillStyle = "#9ec5dc";
      ctx.fillRect(0, yy, W, 44);
      // cracks
      ctx.strokeStyle = "#7aa3bb";
      ctx.lineWidth = 1;
      for (let i=0;i<5;i++){
        const seed = (Math.floor(yy/10)*7 + i*53) % 100 / 100;
        ctx.beginPath();
        ctx.moveTo(seed*W, yy+10);
        ctx.lineTo(seed*W + 30, yy+20);
        ctx.lineTo(seed*W + 10, yy+34);
        ctx.stroke();
      }
      // snowdrifts on shore
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, yy-2, W, 2);
      ctx.fillRect(0, yy+44, W, 2);
      // bridge planks (still on road)
      ctx.fillStyle = "#3e2723";
      ctx.fillRect(W/2-32, yy-2, 64, 48);
      ctx.fillStyle = "#1c1c1c";
      for (let bx = -2; bx < 64; bx += 8){
        ctx.fillRect(W/2-32+bx, yy-2, 2, 48);
      }
    } else if (accent === "lava"){
      // Lava channel
      ctx.fillStyle = "#bf360c";
      ctx.fillRect(0, yy, W, 40);
      ctx.fillStyle = "#ff6f00";
      for (let i=0;i<W;i+=10){
        const ph = Math.sin((i+state.t*3)*0.12)*3;
        ctx.fillRect(i, yy+10+ph, 6, 4);
        ctx.fillRect(i+3, yy+24+ph, 5, 3);
      }
      ctx.fillStyle = "#ffeb3b";
      for (let i=0;i<W;i+=18){
        if ((i + Math.floor(yy)) % 27 === 0){
          ctx.fillRect(i, yy+18 + (state.t%6 - 3), 2, 2);
        }
      }
      // basalt bridge
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(W/2-32, yy-4, 64, 48);
      ctx.fillStyle = "#3e2723";
      for (let bx = 0; bx < 64; bx += 8){
        ctx.fillRect(W/2-32+bx, yy-4, 2, 48);
      }
    } else if (accent === "void"){
      // Sky platform — energy band with stars
      ctx.fillStyle = "rgba(80,40,160,0.5)";
      ctx.fillRect(0, yy, W, 50);
      ctx.fillStyle = "#ce93d8";
      for (let i=0;i<W;i+=12){
        ctx.fillRect(i, yy+8, 1, 1);
        ctx.fillRect(i+5, yy+24, 1, 1);
        ctx.fillRect(i+9, yy+40, 1, 1);
      }
    }
  }

  // bushes/trees scattered
  const baseRow = Math.floor(state.scroll / 24);
  for (let r = 0; r < 25; r++){
    const row = baseRow + r;
    const yy = r*24 - (state.scroll % 24);
    for (let i=0;i<3;i++){
      const h = ((row * 9301 + i*49297) % 233280) / 233280;
      const bx = h * (W-16) + 4;
      // skip if on road
      if (bx > W/2-26 && bx < W/2+26) continue;
      ctx.fillStyle = bush;
      ctx.beginPath();
      ctx.arc(bx, yy, 6, 0, Math.PI*2);
      ctx.arc(bx+5, yy+2, 5, 0, Math.PI*2);
      ctx.arc(bx-4, yy+2, 5, 0, Math.PI*2);
      ctx.fill();
      // highlight
      ctx.fillStyle = stripe;
      ctx.fillRect(bx-2, yy-3, 3, 2);
    }
  }

  // road
  ctx.fillStyle = state.stage === 3 ? "#3e2723" : "#5d4037";
  ctx.fillRect(W/2-22, 0, 44, H);
  ctx.fillStyle = state.stage === 3 ? "#5d4037" : "#8d6e63";
  ctx.fillRect(W/2-22, 0, 4, H);
  ctx.fillRect(W/2+18, 0, 4, H);
  // dashed
  ctx.fillStyle = "#ffd54a";
  for (let y = -16 + (state.scroll%24); y < H; y += 24){
    ctx.fillRect(W/2-1, y, 2, 12);
  }
}

function darken(hex, factor){
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  if (!m) return hex;
  const r = Math.max(0, Math.min(255, Math.floor(parseInt(m[1],16) * factor)));
  const g = Math.max(0, Math.min(255, Math.floor(parseInt(m[2],16) * factor)));
  const b = Math.max(0, Math.min(255, Math.floor(parseInt(m[3],16) * factor)));
  return `rgb(${r},${g},${b})`;
}

function drawSoldier(x,y, color, walkPhase=0, facing=-1){
  const step = Math.sin(walkPhase) * 2;
  const helmet = darken(color, 0.5);
  const helmetDark = darken(color, 0.3);

  // Long shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(x, y+11, 8, 2.5, 0, 0, Math.PI*2); ctx.fill();

  // Backpack (visible when facing up/away)
  if (facing < 0){
    ctx.fillStyle = "#3e2723";
    ctx.fillRect(x-3, y-2, 6, 6);
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x-3, y-2, 6, 1);
    // strap
    ctx.fillStyle = "#222";
    ctx.fillRect(x-2, y-3, 1, 5);
    ctx.fillRect(x+1, y-3, 1, 5);
  }

  // Legs (with boots and walk anim)
  const lLen = 5 + (step>0?1:0);
  const rLen = 5 + (step<0?1:0);
  ctx.fillStyle = darken(color, 0.45);
  ctx.fillRect(x-3, y+3, 2, lLen);
  ctx.fillRect(x+1, y+3, 2, rLen);
  // boots
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-4, y+3+lLen, 4, 2);
  ctx.fillRect(x+0, y+3+rLen, 4, 2);

  // Torso (uniform) — slightly taller, with shading
  ctx.fillStyle = color;
  ctx.fillRect(x-4, y-3, 8, 7);
  // Side shadow
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(x+2, y-3, 2, 7);
  // Left highlight
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(x-4, y-3, 1, 7);
  // Camo blotches
  ctx.fillStyle = darken(color, 0.65);
  ctx.fillRect(x-2, y-1, 2, 2);
  ctx.fillRect(x+1, y+1, 1, 1);

  // Belt
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(x-4, y+2, 8, 1);
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(x-1, y+2, 2, 1);

  // Shoulder pads
  ctx.fillStyle = darken(color, 0.4);
  ctx.fillRect(x-5, y-3, 1, 2);
  ctx.fillRect(x+4, y-3, 1, 2);

  // Head (skin tone with shading)
  ctx.fillStyle = "#f3c28b";
  ctx.fillRect(x-3, y-9, 6, 6);
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(x+2, y-9, 1, 6);
  // Eyes
  if (facing >= 0){
    ctx.fillStyle = "#000";
    ctx.fillRect(x-2, y-7, 1, 1);
    ctx.fillRect(x+1, y-7, 1, 1);
    // Mouth
    ctx.fillStyle = "#8d4a3b";
    ctx.fillRect(x-1, y-5, 2, 1);
  }

  // Helmet
  ctx.fillStyle = helmet;
  ctx.fillRect(x-4, y-11, 8, 3);
  ctx.fillStyle = helmetDark;
  ctx.fillRect(x-4, y-9, 8, 1);
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(x-3, y-11, 6, 1);
  // Strap
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x-3, y-4, 6, 1);

  // Rifle
  ctx.fillStyle = "#1a1a1a";
  if (facing < 0){
    ctx.fillRect(x+1, y-13, 2, 8);   // barrel up
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x+0, y-7, 4, 2);    // wooden stock
    ctx.fillStyle = "#444";
    ctx.fillRect(x+1, y-13, 2, 1);   // muzzle hint
  } else if (facing > 0){
    ctx.fillRect(x-3, y+5, 2, 7);
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x-4, y+8, 4, 2);
  } else {
    ctx.fillRect(x+3, y-2, 7, 2);
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(x+1, y-1, 3, 2);
  }
}

function drawHeavy(e){
  const x=e.x, y=e.y;
  const step = Math.sin(e.walkPhase||0) * 1.5;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(x, y+12, 9, 3, 0, 0, Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle = darken(e.color, 0.4);
  ctx.fillRect(x-3, y+4, 2, 5+(step>0?1:0));
  ctx.fillRect(x+1, y+4, 2, 5+(step<0?1:0));
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-4, y+9+(step>0?1:0), 4, 2);
  ctx.fillRect(x+0, y+9+(step<0?1:0), 4, 2);
  // armor body
  ctx.fillStyle = e.color;
  ctx.fillRect(x-6, y-5, 12, 10);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x+3, y-5, 3, 10);
  ctx.fillStyle = "rgba(255,255,255,0.13)";
  ctx.fillRect(x-6, y-5, 12, 1);
  // armor plates / studs
  ctx.fillStyle = darken(e.color, 0.5);
  ctx.fillRect(x-5, y-3, 1, 1);
  ctx.fillRect(x+4, y-3, 1, 1);
  ctx.fillRect(x-5, y+2, 1, 1);
  ctx.fillRect(x+4, y+2, 1, 1);
  // shoulder armor
  ctx.fillStyle = darken(e.color, 0.5);
  ctx.fillRect(x-7, y-5, 2, 4);
  ctx.fillRect(x+5, y-5, 2, 4);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x-7, y-5, 2, 1);
  ctx.fillRect(x+5, y-5, 2, 1);
  // head
  ctx.fillStyle = "#f3c28b";
  ctx.fillRect(x-3, y-10, 6, 5);
  // visor (heavy soldier wears full visor)
  ctx.fillStyle = "#111";
  ctx.fillRect(x-3, y-8, 6, 2);
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(x-2, y-7, 1, 1);
  ctx.fillRect(x+1, y-7, 1, 1);
  // helmet
  ctx.fillStyle = darken(e.color, 0.4);
  ctx.fillRect(x-4, y-12, 8, 3);
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(x-3, y-12, 6, 1);
  // big LMG
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x+1, y-15, 4, 10);
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(x+0, y-7, 5, 2);
  ctx.fillStyle = "#444";
  ctx.fillRect(x+1, y-15, 4, 1);
}

function drawRocket(e){
  const x=e.x, y=e.y;
  const step = Math.sin(e.walkPhase||0) * 1.5;
  ctx.fillStyle = "rgba(0,0,0,0.4)";

  // legs
  ctx.fillStyle = darken(e.color, 0.45);
  ctx.fillRect(x-3, y+3, 2, 5+(step>0?1:0));

  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x-4, y+8+(step>0?1:0), 4, 2);
  ctx.fillRect(x+0, y+8+(step<0?1:0), 4, 2);
  // body
  ctx.fillStyle = e.color;
  ctx.fillRect(x-4, y-3, 8, 7);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(x+2, y-3, 2, 7);
  ctx.fillStyle = "rgba(255,255,255,0.13)";
  ctx.fillRect(x-4, y-3, 1, 7);
  // belt
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(x-4, y+2, 8, 1);
  // head

  ctx.fillStyle = "#000";

  ctx.fillStyle = "#222";

  // back-blast
  ctx.fillStyle = "#ff7043";
  ctx.fillRect(x-4, y-12, 2, 3);
